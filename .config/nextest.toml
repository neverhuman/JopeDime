# Test tiers (plan: CI and testing). Profile `pr` runs on hosted runners; `main` on xbabe2.
[profile.default]
slow-timeout = { period = "120s", terminate-after = 3 }
fail-fast = false

[profile.pr]
# Slow deadline tests and the campaign crate (package jope-dime-regressor until WP5 renames it; jope-selfplay joins when it exists) run only on main (docs/parity/test-timings.json).
default-filter = "not (package(jope-dime-regressor) | test(/eval_registry::(service|authority|witness)::/) | test(/native_strict/))"
slow-timeout = { period = "120s", terminate-after = 2 }
fail-fast = false

[profile.pr.junit]
path = "junit.xml"

[profile.main]
slow-timeout = { period = "600s", terminate-after = 2 }
fail-fast = false
# Captured output of passing tests is printed after the summary so deploy/ci/no-silent-skip.py can
# attribute "skipping"/"SKIP" markers to the test that printed them.
success-output = "final"

[profile.main.junit]
path = "junit-main.xml"
