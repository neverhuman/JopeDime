name: Runner provenance
description: >-
  Prove the self-hosted runner is executing reviewed merged runner files, rather than assuming
  it. Used by every workflow that runs on the self-hosted lane. Requires the repository to be
  checked out already (fetch-depth: 0 on pull_request so the base rev is readable).

  What this binds, precisely, so it is not read as more than it is:
    - the host files listed in JOPE_RUNNER_DEPLOYED (scripts, units, the drop-in)
    - the image's entrypoint, hashed from inside the container against the bound one
    - the image identity, against the one provision.sh recorded
  What it does NOT bind: the rest of the image's contents. A rebuilt image carrying the same tag
  is caught by the id comparison only until provision.sh is next run.

  Bind rule:
    - pull_request: host digest must equal the digest of deploy/runner from the PR base ref
      (merged main). Hosts still run only reviewed merged code; runner-change PRs can go green
      on current hosts, then deploy after merge.
    - push / workflow_dispatch / other: host digest must equal the checkout under test.

runs:
  using: composite
  steps:
    - name: Deployed scripts, image entrypoint and image identity
      shell: bash
      run: |
        set -euo pipefail
        # BASE_SHA is set by ci.yml for pull_request. Fall back to the event payload so
        # workflow authors cannot accidentally drop the env and silently exact-match the head.
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -z "${BASE_SHA:-}" ] && [ -n "${GITHUB_EVENT_PATH:-}" ]; then
          BASE_SHA=$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["pull_request"]["base"]["sha"])')
          export BASE_SHA
        fi
        python3 deploy/runner/provenance_bind.py verify
    - name: Immutable admission policy and actual cgroup limits
      shell: bash
      run: python3 deploy/runner/verify-container.py
