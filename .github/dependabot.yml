version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    groups: { cargo-all: { patterns: ["*"] } }
    open-pull-requests-limit: 2
  - package-ecosystem: pip
    directory: /python
    schedule: { interval: monthly }
    groups: { pip-all: { patterns: ["*"] } }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
