version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    groups: { cargo-all: { patterns: ["*"] } }
    open-pull-requests-limit: 2
    # Major bumps (ratatui/crossterm, rand, redb, sha2, toml, zip, rusqlite, ed25519-dalek ...) are
    # deliberate code changes, not dependency hygiene: they are proposed by hand, one crate at a time.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /python
    schedule: { interval: monthly }
    groups: { pip-all: { patterns: ["*"] } }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
