name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  JOPE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: [self-hosted, linux, x64, jope-ci]
    # Action setup and a full-history checkout alone can exceed 3 minutes when GitHub endpoints
    # stall from the self-hosted network; the lane itself still finishes in seconds.
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.lane.outputs.rust }}
      emitters: ${{ steps.lane.outputs.emitters }}
      inputs: ${{ steps.lane.outputs.inputs }}
      python: ${{ steps.lane.outputs.python }}
      e2e: ${{ steps.lane.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane changes --output "$evidence" --backend none -- bash deploy/ci/fast-lane.sh changes
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ github.workspace }}/target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  hygiene:
    runs-on: [self-hosted, linux, x64, jope-ci]
    # Headroom for the three bounded evidence-publication attempts, each of which can stall for
    # about two minutes on a blackholed connection before it resets.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane hygiene --output "$evidence" --backend unittest -- bash deploy/ci/fast-lane.sh hygiene
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ github.workspace }}/target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  rust-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane rust-check --output "$evidence" --backend rust -- bash deploy/ci/fast-lane.sh rust-check
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ github.workspace }}/target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  rust-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 45
    env:
      JOPE_PARITY_STRICT: "1"
      OMP_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane rust-test --output "$evidence" --backend nextest --junit "$evidence/junit.xml" -- bash deploy/ci/fast-lane.sh rust-test
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ github.workspace }}/target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  emitters:
    needs: changes
    if: needs.changes.outputs.emitters == 'true'
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 30
    env:
      JOPE_PARITY_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane emitters --output "$evidence" --backend rust -- bash deploy/ci/fast-lane.sh emitters
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ github.workspace }}/target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  inputs:
    needs: changes
    if: needs.changes.outputs.inputs == 'true'
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane inputs --output "$evidence" --backend none -- bash deploy/ci/fast-lane.sh inputs
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ github.workspace }}/target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane python --output "$evidence" --backend pytest --junit "$evidence/junit.xml" -- bash deploy/ci/fast-lane.sh python
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ github.workspace }}/target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  e2e-smoke:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane e2e-smoke --output "$evidence" --backend none -- bash deploy/ci/fast-lane.sh e2e-smoke
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ github.workspace }}/target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  aggregate:
    needs: [changes, hygiene, rust-check, rust-test, emitters, inputs, python, e2e-smoke]
    if: always()
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      # A connection reset part-way through the download leaves an artifact directory empty, which
      # aggregate.py correctly refuses. Retry the whole download at most twice more, from an empty
      # directory each time; exactly one complete attempt is required (same gate as publication).
      - name: Download this run and attempt only (attempt 1)
        id: download-first
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          pattern: ci-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Clear the partial download before attempt 2
        if: steps.download-first.outcome == 'failure'
        run: rm -rf -- "target/ci-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
      - name: Download this run and attempt only (attempt 2)
        id: download-second
        if: steps.download-first.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          pattern: ci-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Clear the partial download before attempt 3
        if: steps.download-first.outcome == 'failure' && steps.download-second.outcome == 'failure'
        run: rm -rf -- "target/ci-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
      - name: Download this run and attempt only (attempt 3)
        id: download-third
        if: steps.download-first.outcome == 'failure' && steps.download-second.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          pattern: ci-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Require one complete bounded download
        env:
          FIRST: ${{ steps.download-first.outcome }}
          SECOND: ${{ steps.download-second.outcome }}
          THIRD: ${{ steps.download-third.outcome }}
        run: bash deploy/ci/publication-status.sh "$FIRST" "$SECOND" "$THIRD"
      - name: Validate every required result
        if: always()
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          output="target/ci-aggregate/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mkdir -p "$output"
          printf '%s\n' "$NEEDS_JSON" > "$output/needs.json"
          python3 deploy/ci/aggregate.py --receipts "target/ci-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --needs "$output/needs.json" --output "$output/aggregate.json"
      - name: Upload aggregate inventory
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-aggregate/${{ github.run_id }}/${{ github.run_attempt }}/
