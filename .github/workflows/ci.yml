name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate: docs-only pull requests run hygiene only; workflow_dispatch runs everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      emitters: ${{ steps.filter.outputs.emitters }}
      inputs: ${{ steps.filter.outputs.inputs }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0 (pin unchanged from main; the old comment said v5)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          rust=true; emitters=true; inputs=true; python=true
          # The checkout is the pull request's merge ref with full history, so the base commit is
          # present without another fetch (persist-credentials is off, so a fetch could not auth).
          if [ -n "$BASE_SHA" ]; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
            printf 'changed files:\n%s\n' "$changed"
            grep -qE '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.config/nextest\.toml$|deny\.toml$|deploy/ci/|deploy/systemd/|\.github/workflows/ci\.yml$)' <<<"$changed" || rust=false
            grep -qE '^(crates/feat-math/|datasets/test/|deploy/ci/emitters|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)' <<<"$changed" || emitters=false
            grep -qE '^(datasets/synthetic/|crates/jope-cli/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)' <<<"$changed" || inputs=false
            grep -qE '^(python/|deploy/systemd/|\.github/workflows/ci\.yml$)' <<<"$changed" || python=false
          fi
          { echo "rust=$rust"; echo "emitters=$emitters"; echo "inputs=$inputs"; echo "python=$python"; } >> "$GITHUB_OUTPUT"
          echo "rust=$rust emitters=$emitters inputs=$inputs python=$python"

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0 (pin unchanged from main; the old comment said v5)
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Install linters
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.8/actionlint_1.7.8_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin actionlint
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Hygiene
        run: bash deploy/ci/check.sh
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@34899fc7ba81ca6268d5947a7a16b4649013fea1 # v2
        with:
          command: check bans licenses sources

  # The whole workspace type-checks on a hosted runner without CUDA, LibTorch or a GPU
  # (`neural`, `gpu`, `hyperion-cuda` stay off; those lanes are self-hosted, main/nightly only).
  rust-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0 (pin unchanged from main; the old comment said v5)
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-check
      - name: cargo check --workspace --all-targets --locked
        run: cargo check --workspace --all-targets --locked
      # The rendered-systemd guarantee (no /home/ literal, no unrendered @JOPE_* token, every
      # ExecStart under the rendered roots) lives in this test, which `cargo check` compiles but
      # never runs. deploy/systemd/ is in this lane's gate above so a template-only change — the
      # exact shape of #32 — reaches it. The package in crates/jope-campaigns is named
      # jope-dime-regressor.
      - name: Rendered systemd units resolve under the rendered roots
        run: cargo test -p jope-dime-regressor --locked --test systemd_unit_paths
      - name: "Workspace MSRV (decision 8: at most 1.97.1)"
        run: |
          set -euo pipefail
          cargo metadata --no-deps --locked --format-version 1 > /tmp/metadata.json
          python3 - <<'PY'
          import json
          packages = json.load(open('/tmp/metadata.json'))['packages']
          versions = sorted({p['rust_version'] for p in packages if p.get('rust_version')})
          print('rust-version values in the workspace:', versions)
          assert versions and versions[-1].split('.')[:2] <= ['1', '97'], versions
          PY

  # Emitted code: the Python/Rust bit-identical pair, the four-language portable genome across
  # g++/clang++ × C++17/C++20 and node, byte-identical sources and prediction bits against the
  # committed expectations; plus the strict portable-parity test (no backend may be skipped).
  emitters:
    needs: changes
    if: needs.changes.outputs.emitters == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      JOPE_PARITY_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0 (pin unchanged from main; the old comment said v5)
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: emitters
      - name: Compilers on this runner
        run: |
          set -euo pipefail
          for tool in g++ clang++ node python3 rustc; do printf '%s: ' "$tool"; "$tool" --version | head -1; done
      - name: Emitted-code matrix
        run: bash deploy/ci/emitters.sh
      # Two invocations: a name filter given once applies to every selected test binary, so the
      # previous single command ran 0 of the portable_parity tests (found in review of #24).
      - name: Strict portable parity — cxx helper unit tests
        run: "cargo test -p feat-math --locked --lib -- cxx::"
      - name: Strict portable parity — portable_all_helper_backends_match_bits
        run: cargo test -p feat-math --locked --test portable_parity

  # Committed fixtures: the synthetic datasets verify against their catalog offline and the pinned
  # generator reproduces them byte for byte. Runs whenever datasets/synthetic or the CLI change.
  inputs:
    needs: changes
    if: needs.changes.outputs.inputs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0 (pin unchanged from main; the old comment said v5)
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: inputs
      - name: Verify the committed fixtures offline
        run: cargo run --locked --bin jope -- verify-inputs --offline --json --root datasets/synthetic
      - name: Generator reproduces the committed fixtures
        run: cargo run --locked --bin jope -- generate-fixtures --check --json --output datasets/synthetic

  # The Python compatibility/training surface: the uv project must install, lint, format and pass
  # its tests. Nothing hosted ran these before, which is how a systemd-template rename silently
  # broke tests/test_durable_selfplay.py; deploy/systemd is in the gate for exactly that reason.
  # Tests that need the old state plane on xbabe2 carry the `xbabe2` marker and are deselected.
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Sync the locked environment (CPU torch)
        working-directory: python
        run: uv sync --locked --extra dev --extra cpu
      - name: Ruff lint and format
        working-directory: python
        run: |
          set -euo pipefail
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Pytest (xbabe2-only tests deselected)
        working-directory: python
        run: uv run --no-sync pytest -q -m "not xbabe2" -p no:cacheprovider

  # The hosted gate ran NO Rust tests: `rust-check` is `cargo check`, and the only `cargo test` in
  # this file was `-p feat-math`. So every integration test in the repo was compiled and never run,
  # which is how 14 broken engine tests sat unnoticed. This lane closes that.
  #   step 1 blocks on the whole PR tier except the two documented sets;
  #   step 2 blocks on the binaries that must not race (they pass serially — they are not broken);
  #   step 3 runs the known-broken set and reports without blocking, so a recovery is visible and
  #          the allowlist cannot quietly rot.
  # deploy/ci/rust-test-filter.sh is the single source of truth shared with the justfile.
  rust-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      OMP_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      JOPE_PARITY_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-test
      - name: Install cargo-nextest
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-nextest
      - name: PR tier, blocking
        run: cargo nextest run -P pr --workspace --locked -E "$(bash deploy/ci/rust-test-filter.sh)"
      - name: Serial-only binaries, blocking
        run: cargo nextest run -P pr --workspace --locked --test-threads 1 -E "$(bash deploy/ci/rust-test-filter.sh --serial)"
      - name: Known-broken set (informative; a pass here means delete its line)
        continue-on-error: true
        run: cargo nextest run -P pr --workspace --locked --test-threads 2 -E "$(bash deploy/ci/rust-test-filter.sh --broken)"
