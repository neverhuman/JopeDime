name: ci
on:
  # Deliberate PR event: manual-dispatch job checks do not satisfy PR rulesets.
  # Mark a draft PR ready after freezing its source to run this full matrix.
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      provenance_pr:
        description: "Optional open same-repository PR number; validate exact head and bind installed runner files to current merged main"
        type: string
        required: false
        default: ""
      runner_pool:
        description: "Use native Linux workers while Mac capacity is unavailable"
        type: choice
        options:
          - auto
          - native
        default: auto
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  JOPE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes-pr:
    if: github.event_name == 'pull_request'
    # PR-controlled source classification runs on a disposable hosted worker.
    runs-on: ubuntu-24.04
    # Action setup and a full-history checkout can exceed 3 minutes when GitHub endpoints stall.
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.lane.outputs.rust }}
      emitters: ${{ steps.lane.outputs.emitters }}
      inputs: ${{ steps.lane.outputs.inputs }}
      python: ${{ steps.lane.outputs.python }}
      e2e: ${{ steps.lane.outputs.e2e }}
      runner_pool: jope-ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/changes"
          python3 deploy/ci/receipt.py --lane changes --output "$evidence" --backend none -- bash ops/ci/fast-lane.sh changes
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-changes
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/changes/

  changes-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # Candidate refs are refused below. Trusted-main dispatch keeps the admitted native
    # runner and exact deployed-policy proof.
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.lane.outputs.rust }}
      emitters: ${{ steps.lane.outputs.emitters }}
      inputs: ${{ steps.lane.outputs.inputs }}
      python: ${{ steps.lane.outputs.python }}
      e2e: ${{ steps.lane.outputs.e2e }}
      runner_pool: ${{ inputs.runner_pool == 'native' && 'jope-ci' || steps.provenance.outputs.runner-pool }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Runner provenance
        id: provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/changes"
          python3 deploy/ci/receipt.py --lane changes --output "$evidence" --backend none -- bash ops/ci/fast-lane.sh changes
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-changes
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/changes/

  reject-untrusted-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse non-main manual source
        run: |
          echo "workflow_dispatch may use the privileged CI runners only from refs/heads/main; use the ready_for_review PR event for candidate source" >&2
          exit 1

  changes:
    needs: [changes-pr, changes-dispatch, reject-untrusted-dispatch]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ needs['changes-pr'].outputs.rust || needs['changes-dispatch'].outputs.rust }}
      emitters: ${{ needs['changes-pr'].outputs.emitters || needs['changes-dispatch'].outputs.emitters }}
      inputs: ${{ needs['changes-pr'].outputs.inputs || needs['changes-dispatch'].outputs.inputs }}
      python: ${{ needs['changes-pr'].outputs.python || needs['changes-dispatch'].outputs.python }}
      e2e: ${{ needs['changes-pr'].outputs.e2e || needs['changes-dispatch'].outputs.e2e }}
      runner_pool: ${{ needs['changes-pr'].outputs.runner_pool || needs['changes-dispatch'].outputs.runner_pool }}
    steps:
      - name: Require the classifier for this event
        env:
          EVENT: ${{ github.event_name }}
          PR_RESULT: ${{ needs['changes-pr'].result }}
          DISPATCH_RESULT: ${{ needs['changes-dispatch'].result }}
          DISPATCH_REFUSAL_RESULT: ${{ needs['reject-untrusted-dispatch'].result }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) test "$PR_RESULT" = success ;;
            workflow_dispatch)
              if [ "$REF" = refs/heads/main ]; then
                test "$DISPATCH_RESULT" = success
                test "$DISPATCH_REFUSAL_RESULT" = skipped
              else
                test "$DISPATCH_RESULT" = skipped
                test "$DISPATCH_REFUSAL_RESULT" = failure
                echo "non-main manual dispatch was refused before privileged runner admission" >&2
                exit 1
              fi
              ;;
            *) echo "unsupported CI event: $EVENT" >&2; exit 2 ;;
          esac

  hygiene:
    # Release security checks require an actually empty tool HOME. Rosetta
    # creates .cache/rosetta when jq starts; retain the checks on native Linux.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, jope-ci, xbabe1-ci]
    # Headroom for the three bounded evidence-publication attempts, each of which can stall for
    # about two minutes on a blackholed connection before it resets.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane hygiene --output "$evidence" --backend unittest -- bash ops/ci/fast-lane.sh hygiene
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  jankurai-audit:
    # A required CI job for same-repository PRs and manual runs; fork PRs do not write to the
    # self-hosted evidence store.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, x64, jope-ci, xbabe1-ci]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Install checksum-pinned Jankurai
        id: install-jankurai
        run: bash deploy/ci/install-jankurai.sh
      - name: Run full Jankurai audit and verify captured source
        id: run-jankurai-audit
        env:
          JANKURAI_NO_UPDATE_CHECK: "1"
          JANKURAI_BIN: ${{ github.workspace }}/target/jankurai/jankurai-1.7.5-x86_64-unknown-linux-gnu/jankurai
          # Owner decision 2026-10-22: report-only below the score floor of 85; the audit decision
          # and verified source evidence remain retained until the floor is reached.
          JOPE_AUDIT_REPORT_ONLY: "1"
        run: nice -n 10 bash ops/ci/jankurai.sh "target/full-audit/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
      - name: Publish canonical repair-routing reports
        id: repair-reports
        if: always()
        env:
          REPORTS: target/full-audit/${{ github.run_id }}/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ -f "$REPORTS/repo-score.json" && -f "$REPORTS/repo-score.md" ]]; then
            mkdir -p .jankurai
            cp -- "$REPORTS/repo-score.json" .jankurai/repo-score.json
            cp -- "$REPORTS/repo-score.md" .jankurai/repo-score.md
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Retain current Jankurai audit evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: jankurai-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/full-audit/${{ github.run_id }}/${{ github.run_attempt }}/

  rust-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, "${{ needs.changes.outputs.runner_pool || 'jope-ci' }}"]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane rust-check --output "$evidence" --backend rust -- bash ops/ci/fast-lane.sh rust-check
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  rust-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Rust subprocess/timeout contracts need native x86-64; Rosetta returns exit 127
    # for a missing executable instead of ENOENT. Keep both complete test slices on
    # existing native Linux slots, preserving every test and timeout.
    runs-on: [self-hosted, linux, x64, jope-ci, "${{ matrix.shard == 1 && 'xbabe1-ci2' || 'xbabe2-ci' }}"]
    timeout-minutes: 45
    # Two deterministic nextest slices of the unchanged selection, one per jope-ci runner. Both
    # always finish so every failure is reported; the aggregate job proves (check_test_partition.py)
    # that the slices select and execute the unsharded rust-test set exactly once between them.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      JOPE_PARITY_STRICT: "1"
      OMP_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      JOPE_RUST_TEST_PARTITION: slice:${{ matrix.shard }}/2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB-$SHARD"
          python3 deploy/ci/receipt.py --lane rust-test --output "$evidence" --backend nextest --junit "$evidence/junit.xml" -- bash ops/ci/fast-lane.sh rust-test
        env:
          SHARD: ${{ matrix.shard }}
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}-${{ matrix.shard }}/

  emitters:
    needs: changes
    if: needs.changes.outputs.emitters == 'true'
    runs-on: [self-hosted, linux, x64, "${{ needs.changes.outputs.runner_pool || 'jope-ci' }}"]
    timeout-minutes: 30
    env:
      JOPE_PARITY_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane emitters --output "$evidence" --backend rust -- bash ops/ci/fast-lane.sh emitters
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  inputs:
    needs: changes
    if: needs.changes.outputs.inputs == 'true'
    runs-on: [self-hosted, linux, x64, "${{ needs.changes.outputs.runner_pool || 'jope-ci' }}"]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane inputs --output "$evidence" --backend none -- bash ops/ci/fast-lane.sh inputs
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: [self-hosted, linux, x64, "${{ needs.changes.outputs.runner_pool || 'jope-ci' }}"]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane python --output "$evidence" --backend pytest --junit "$evidence/junit.xml" -- bash ops/ci/fast-lane.sh python
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  e2e-smoke:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: [self-hosted, linux, x64, "${{ needs.changes.outputs.runner_pool || 'jope-ci' }}"]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane e2e-smoke --output "$evidence" --backend none -- bash ops/ci/fast-lane.sh e2e-smoke
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  observatory-ui:
    needs: changes
    runs-on: [self-hosted, linux, x64, "${{ needs.changes.outputs.runner_pool || 'jope-ci' }}"]
    timeout-minutes: 25
    env:
      JOPE_UI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Node 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.1.0'
      - name: Typecheck, nonzero tests and production build
        working-directory: web/training-dashboard
        shell: bash
        run: |
          set -euo pipefail
          raw_results="$RUNNER_TEMP/jope-observatory-ui/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/raw"
          bundle="$GITHUB_WORKSPACE/target/observatory-ui/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mkdir -p "$raw_results" "$bundle"
          test "$(git rev-parse HEAD)" = "$JOPE_UI_SOURCE_SHA"
          node --version
          npm --version
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- --reporter=json --outputFile="$raw_results/tests.json"
          node --input-type=module "$raw_results/tests.json" "$JOPE_UI_SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$bundle/receipt.json" <<'JS'
          import fs from 'node:fs';
          const [, testsPath, sourceSha, runId, attempt] = process.argv;
          const r = JSON.parse(fs.readFileSync(testsPath, 'utf8'));
          if (!(r.numTotalTests > 0) || r.numFailedTests !== 0 || !r.success) throw new Error('Nonzero passing frontend tests required');
          process.stdout.write(JSON.stringify({schema:'jope.observatory-ui-ci/v1', source_sha:sourceSha, run_id:runId, attempt, node:process.version, executed:r.numTotalTests, passed:r.numPassedTests, failed:r.numFailedTests, scope:'frontend fixtures; not live training qualification'}, null, 2));
          JS
          npm run build
          sha256sum package-lock.json dist/index.html dist/assets/* > "$raw_results/build-sha256.txt"
      - name: Rendered UX, keyboard navigation and accessibility
        working-directory: web/training-dashboard
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: |
          set -euo pipefail
          export JOPE_UX_EVIDENCE="$GITHUB_WORKSPACE/target/observatory-ui/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/rendered"
          export PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/target/browser-cache/playwright"
          native_receipt="$JOPE_UX_EVIDENCE/browser-dependencies.json"
          runtime=$(python3 "$GITHUB_WORKSPACE/deploy/ci/browser-deps.py" --cache "$GITHUB_WORKSPACE/target/tool-cache/chromium-dependencies" --receipt "$native_receipt")
          export LD_LIBRARY_PATH="$runtime/usr/lib/x86_64-linux-gnu:$runtime/lib/x86_64-linux-gnu:$runtime/usr/lib:$runtime/lib"
          FONTCONFIG_FILE=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["fontconfig"])' "$native_receipt")
          export FONTCONFIG_FILE
          npx playwright install --only-shell chromium
          npm run test:rendered
          checkout_sha=$(git rev-parse HEAD)
          test "$checkout_sha" = "$JOPE_UI_SOURCE_SHA"
          python3 "$GITHUB_WORKSPACE/deploy/ci/rendered-ux-receipt.py" create --root "$JOPE_UX_EVIDENCE" --source-sha "$JOPE_UI_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --checkout-sha "$checkout_sha" --event-sha "$GITHUB_SHA"
      - name: Retain exact-head frontend evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: observatory-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/observatory-ui/${{ github.run_id }}/${{ github.run_attempt }}/

  typescript:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.emitters == 'true'
    uses: ./.github/workflows/typescript.yml

  paper:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/paper.yml

  go:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.emitters == 'true'
    uses: ./.github/workflows/go.yml

  export-parity:
    if: github.repository == 'neverhuman/JopeDime' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/export-parity.yml

  aggregate:
    needs: [changes, hygiene, jankurai-audit, rust-check, rust-test, emitters, inputs, python, e2e-smoke, observatory-ui, paper, typescript, go, export-parity]
    if: always() && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, x64, "${{ needs.changes.outputs.runner_pool || 'jope-ci' }}"]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Require the current-source Jankurai audit
        env:
          JANKURAI_AUDIT_RESULT: ${{ needs.jankurai-audit.result }}
          JANKURAI_AUDIT_REQUIRED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          expected=skipped
          if [ "$JANKURAI_AUDIT_REQUIRED" = true ]; then expected=success; fi
          test "$JANKURAI_AUDIT_RESULT" = "$expected"
      # Evidence arrives through run/attempt-scoped cache entries (no artifact storage); each unit
      # lands in its own directory under ci-download, exactly the layout aggregate.py verifies.
      - name: Collect changes evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-changes
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/changes/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect hygiene evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-hygiene
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/hygiene/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect rust-check evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-rust-check
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/rust-check/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect rust-test-1 evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-rust-test-1
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/rust-test-1/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect rust-test-2 evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-rust-test-2
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/rust-test-2/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect emitters evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-emitters
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/emitters/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect inputs evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-inputs
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/inputs/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect python evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-python
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/python/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect e2e-smoke evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e-smoke
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/e2e-smoke/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect publication evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/paper/
          into: target/ci-paper-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Require exact-head publication source-check evidence
        if: always()
        env:
          PAPER_RESULT: ${{ needs.paper.result }}
        run: |
          set -euo pipefail
          test "$PAPER_RESULT" = success
          python3 deploy/ci/aggregate-evidence.py publication \
            --root "target/ci-paper-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --source-sha "$JOPE_SOURCE_SHA" --checkout-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --event "$GITHUB_EVENT_NAME"
      - name: Collect frontend evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: observatory-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/observatory-ui/${{ github.run_id }}/${{ github.run_attempt }}/
          into: target/ci-ui-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Require exact-head nonzero frontend tests
        if: always()
        env:
          UI_RESULT: ${{ needs.observatory-ui.result }}
        run: |
          set -euo pipefail
          test "$UI_RESULT" = success
          python3 deploy/ci/aggregate-evidence.py frontend \
            --root "target/ci-ui-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --source-sha "$JOPE_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Require exact-head complete rendered UX evidence
        if: always()
        run: |
          set -euo pipefail
          # UI checks out the source head explicitly; aggregate may use a synthetic PR merge.
          python3 deploy/ci/aggregate-evidence.py rendered-ux \
            --root "target/ci-ui-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --source-sha "$JOPE_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --event-sha "$GITHUB_SHA"
      - name: Collect TypeScript Node 24.19.0 evidence
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.emitters == 'true'
        uses: ./.github/actions/download-ci-evidence
        with:
          name: typescript-${{ github.run_id }}-${{ github.run_attempt }}-24.19.0
          path: target/typescript-evidence/
          layout: name
          into: target/ci-typescript-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect TypeScript Node 26.1.0 evidence
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.emitters == 'true'
        uses: ./.github/actions/download-ci-evidence
        with:
          name: typescript-${{ github.run_id }}-${{ github.run_attempt }}-26.1.0
          path: target/typescript-evidence/
          layout: name
          into: target/ci-typescript-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Require both exact-source TypeScript matrix receipts
        if: always() && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.emitters == 'true')
        env:
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
        run: |
          set -euo pipefail
          test "$TYPESCRIPT_RESULT" = success
          for version in 24.19.0 26.1.0; do
            root="target/ci-typescript-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/typescript-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$version"
            node deploy/ci/typescript/evidence.mjs verify "$root" "$version"
          done
      - name: Collect hosted export parity evidence
        if: always() && github.repository == 'neverhuman/JopeDime' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/download-ci-evidence
        with:
          name: export-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/export-parity/${{ github.run_id }}/${{ github.run_attempt }}
          into: target/ci-export-parity/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Verify exact-source hosted export parity
        if: always() && github.repository == 'neverhuman/JopeDime' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          EXPORT_RESULT: ${{ needs.export-parity.result }}
        run: |
          set -euo pipefail
          test "$EXPORT_RESULT" = success
          python3 deploy/ci/aggregate-evidence.py export-parity \
            --root "target/ci-export-parity/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --source-sha "$JOPE_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --repository "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME"
      - name: Retain hosted export parity on aggregate runner
        if: always() && github.repository == 'neverhuman/JopeDime' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: export-parity-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-export-parity/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Validate every required result
        if: always()
        env:
          EXPORT_RESULT: ${{ needs.export-parity.result }}
          EXPORT_REQUIRED: ${{ github.repository == 'neverhuman/JopeDime' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
          GO_RESULT: ${{ needs.go.result }}
          GO_REQUIRED: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.emitters == 'true' }}
          JANKURAI_AUDIT_RESULT: ${{ needs.jankurai-audit.result }}
          JANKURAI_AUDIT_REQUIRED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          NEEDS_JSON: ${{ toJson(needs) }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          TYPESCRIPT_REQUIRED: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.emitters == 'true' }}
        run: |
          set -euo pipefail
          output="target/ci-aggregate/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mkdir -p "$output"
          printf '%s\n' "$NEEDS_JSON" > "$output/all-needs.json"
          expected=skipped
          if [ "$GO_REQUIRED" = true ]; then expected=success; fi
          test "$GO_RESULT" = "$expected"
          expected=skipped
          if [ "$TYPESCRIPT_REQUIRED" = true ]; then expected=success; fi
          test "$TYPESCRIPT_RESULT" = "$expected"
          expected=skipped
          if [ "$EXPORT_REQUIRED" = true ]; then expected=success; fi
          test "$EXPORT_RESULT" = "$expected"
          expected=skipped
          if [ "$JANKURAI_AUDIT_REQUIRED" = true ]; then expected=success; fi
          test "$JANKURAI_AUDIT_RESULT" = "$expected"
          # UI, publication, language and export evidence are independently verified above.
          python3 deploy/ci/aggregate-evidence.py filter-needs \
            --input "$output/all-needs.json" --output "$output/needs.json" \
            --exclude observatory-ui --exclude paper --exclude go --exclude typescript \
            --exclude export-parity --exclude jankurai-audit
          python3 deploy/ci/aggregate.py --receipts "target/ci-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --needs "$output/needs.json" --output "$output/aggregate.json"
      # aggregate.py already fails on this; the separate report is the retained proof.
      - name: Rust test slices cover the unsharded rust-test set exactly once
        if: always() && needs.changes.outputs.rust == 'true'
        run: |
          set -euo pipefail
          output="target/ci-aggregate/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mkdir -p "$output"
          python3 deploy/ci/check_test_partition.py rust-shards --receipts "target/ci-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --output "$output/rust-test-partition.json"
      - name: Upload aggregate inventory
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-aggregate/${{ github.run_id }}/${{ github.run_attempt }}/
