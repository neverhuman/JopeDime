name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate: docs-only pull requests run hygiene only; workflow_dispatch runs everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      emitters: ${{ steps.filter.outputs.emitters }}
      inputs: ${{ steps.filter.outputs.inputs }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          rust=true; emitters=true; inputs=true
          # The checkout is the pull request's merge ref with full history, so the base commit is
          # present without another fetch (persist-credentials is off, so a fetch could not auth).
          if [ -n "$BASE_SHA" ]; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
            printf 'changed files:\n%s\n' "$changed"
            grep -qE '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.config/nextest\.toml$|deny\.toml$|deploy/ci/|\.github/workflows/ci\.yml$)' <<<"$changed" || rust=false
            grep -qE '^(crates/feat-math/|datasets/test/|deploy/ci/emitters|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)' <<<"$changed" || emitters=false
            grep -qE '^(datasets/synthetic/|crates/jope-cli/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)' <<<"$changed" || inputs=false
          fi
          { echo "rust=$rust"; echo "emitters=$emitters"; echo "inputs=$inputs"; } >> "$GITHUB_OUTPUT"
          echo "rust=$rust emitters=$emitters inputs=$inputs"

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v5
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Install linters
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.8/actionlint_1.7.8_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin actionlint
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Hygiene
        run: bash deploy/ci/check.sh
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@34899fc7ba81ca6268d5947a7a16b4649013fea1 # v2
        with:
          command: check bans licenses sources

  # The whole workspace type-checks on a hosted runner without CUDA, LibTorch or a GPU
  # (`neural`, `gpu`, `hyperion-cuda` stay off; those lanes are self-hosted, main/nightly only).
  rust-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v5
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-check
      - name: cargo check --workspace --all-targets --locked
        run: cargo check --workspace --all-targets --locked
      - name: "Workspace MSRV (decision 8: at most 1.97.1)"
        run: |
          set -euo pipefail
          cargo metadata --no-deps --locked --format-version 1 > /tmp/metadata.json
          python3 - <<'PY'
          import json
          packages = json.load(open('/tmp/metadata.json'))['packages']
          versions = sorted({p['rust_version'] for p in packages if p.get('rust_version')})
          print('rust-version values in the workspace:', versions)
          assert versions and versions[-1].split('.')[:2] <= ['1', '97'], versions
          PY

  # Emitted code: the Python/Rust bit-identical pair, the four-language portable genome across
  # g++/clang++ × C++17/C++20 and node, byte-identical sources and prediction bits against the
  # committed expectations; plus the strict portable-parity test (no backend may be skipped).
  emitters:
    needs: changes
    if: needs.changes.outputs.emitters == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      JOPE_PARITY_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v5
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: emitters
      - name: Compilers on this runner
        run: |
          set -euo pipefail
          for tool in g++ clang++ node python3 rustc; do printf '%s: ' "$tool"; "$tool" --version | head -1; done
      - name: Emitted-code matrix
        run: bash deploy/ci/emitters.sh
      - name: Strict portable parity (Rust, C++17, C++20, Python, JavaScript)
        run: "cargo test -p feat-math --locked --lib cxx:: --test portable_parity"

  # Committed fixtures: the synthetic datasets verify against their catalog offline and the pinned
  # generator reproduces them byte for byte. Runs whenever datasets/synthetic or the CLI change.
  inputs:
    needs: changes
    if: needs.changes.outputs.inputs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v5
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: inputs
      - name: Verify the committed fixtures offline
        run: cargo run --locked --bin jope -- verify-inputs --offline --json --root datasets/synthetic
      - name: Generator reproduces the committed fixtures
        run: cargo run --locked --bin jope -- generate-fixtures --check --json --output datasets/synthetic
