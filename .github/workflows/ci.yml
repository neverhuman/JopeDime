name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  JOPE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: [self-hosted, linux, x64, jope-ci]
    # Action setup and a full-history checkout alone can exceed 3 minutes when GitHub endpoints
    # stall from the self-hosted network; the lane itself still finishes in seconds.
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.lane.outputs.rust }}
      emitters: ${{ steps.lane.outputs.emitters }}
      inputs: ${{ steps.lane.outputs.inputs }}
      python: ${{ steps.lane.outputs.python }}
      e2e: ${{ steps.lane.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane changes --output "$evidence" --backend none -- bash deploy/ci/fast-lane.sh changes
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  hygiene:
    runs-on: [self-hosted, linux, x64, jope-ci]
    # Headroom for the three bounded evidence-publication attempts, each of which can stall for
    # about two minutes on a blackholed connection before it resets.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane hygiene --output "$evidence" --backend unittest -- bash deploy/ci/fast-lane.sh hygiene
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  rust-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane rust-check --output "$evidence" --backend rust -- bash deploy/ci/fast-lane.sh rust-check
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  rust-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 45
    # Two deterministic nextest slices of the unchanged selection, one per jope-ci runner. Both
    # always finish so every failure is reported; the aggregate job proves (check_test_partition.py)
    # that the slices select and execute the unsharded rust-test set exactly once between them.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      JOPE_PARITY_STRICT: "1"
      OMP_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      JOPE_RUST_TEST_PARTITION: slice:${{ matrix.shard }}/2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB-$SHARD"
          python3 deploy/ci/receipt.py --lane rust-test --output "$evidence" --backend nextest --junit "$evidence/junit.xml" -- bash deploy/ci/fast-lane.sh rust-test
        env:
          SHARD: ${{ matrix.shard }}
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}-${{ matrix.shard }}/

  emitters:
    needs: changes
    if: needs.changes.outputs.emitters == 'true'
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 30
    env:
      JOPE_PARITY_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane emitters --output "$evidence" --backend rust -- bash deploy/ci/fast-lane.sh emitters
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  inputs:
    needs: changes
    if: needs.changes.outputs.inputs == 'true'
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane inputs --output "$evidence" --backend none -- bash deploy/ci/fast-lane.sh inputs
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane python --output "$evidence" --backend pytest --junit "$evidence/junit.xml" -- bash deploy/ci/fast-lane.sh python
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  e2e-smoke:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane e2e-smoke --output "$evidence" --backend none -- bash deploy/ci/fast-lane.sh e2e-smoke
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  aggregate:
    needs: [changes, hygiene, rust-check, rust-test, emitters, inputs, python, e2e-smoke]
    if: always()
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      # Evidence arrives through run/attempt-scoped cache entries (no artifact storage); each unit
      # lands in its own directory under ci-download, exactly the layout aggregate.py verifies.
      - name: Collect changes evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-changes
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/changes/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect hygiene evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-hygiene
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/hygiene/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect rust-check evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-rust-check
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/rust-check/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect rust-test-1 evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-rust-test-1
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/rust-test-1/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect rust-test-2 evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-rust-test-2
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/rust-test-2/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect emitters evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-emitters
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/emitters/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect inputs evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-inputs
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/inputs/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect python evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-python
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/python/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect e2e-smoke evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e-smoke
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/e2e-smoke/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Validate every required result
        if: always()
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          output="target/ci-aggregate/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mkdir -p "$output"
          printf '%s\n' "$NEEDS_JSON" > "$output/needs.json"
          python3 deploy/ci/aggregate.py --receipts "target/ci-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --needs "$output/needs.json" --output "$output/aggregate.json"
      # aggregate.py already fails on this; the separate report is the retained proof.
      - name: Rust test slices cover the unsharded rust-test set exactly once
        if: always() && needs.changes.outputs.rust == 'true'
        run: |
          set -euo pipefail
          output="target/ci-aggregate/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mkdir -p "$output"
          python3 deploy/ci/check_test_partition.py rust-shards --receipts "target/ci-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --output "$output/rust-test-partition.json"
      - name: Upload aggregate inventory
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-aggregate/${{ github.run_id }}/${{ github.run_attempt }}/
