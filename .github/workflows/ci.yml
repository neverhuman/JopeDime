name: ci
on:
  # Deliberate PR event: manual-dispatch job checks do not satisfy PR rulesets.
  # Mark a draft PR ready after freezing its source to run this full matrix.
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      provenance_pr:
        description: "Optional open same-repository PR number; validate exact head and bind installed runner files to current merged main"
        type: string
        required: false
        default: ""
      runner_pool:
        description: "Use native Linux workers while Mac capacity is unavailable"
        type: choice
        options:
          - auto
          - native
        default: auto
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  JOPE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: [self-hosted, linux, x64, jope-ci]
    # Action setup and a full-history checkout alone can exceed 3 minutes when GitHub endpoints
    # stall from the self-hosted network; the lane itself still finishes in seconds.
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.lane.outputs.rust }}
      emitters: ${{ steps.lane.outputs.emitters }}
      inputs: ${{ steps.lane.outputs.inputs }}
      python: ${{ steps.lane.outputs.python }}
      e2e: ${{ steps.lane.outputs.e2e }}
      # Keep deliberate PR CI on qualified native workers during Mac recovery.
      # The helper still verifies merged capability; no arbitrary label is accepted.
      runner_pool: ${{ (github.event_name == 'pull_request' || inputs.runner_pool == 'native') && 'jope-ci' || steps.provenance.outputs.runner-pool }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Runner provenance
        id: provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane changes --output "$evidence" --backend none -- bash ops/ci/fast-lane.sh changes
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  hygiene:
    # Release security checks require an actually empty tool HOME. Rosetta
    # creates .cache/rosetta when jq starts; retain the checks on native Linux.
    runs-on: [self-hosted, linux, x64, jope-ci, xbabe1-ci]
    # Headroom for the three bounded evidence-publication attempts, each of which can stall for
    # about two minutes on a blackholed connection before it resets.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane hygiene --output "$evidence" --backend unittest -- bash ops/ci/fast-lane.sh hygiene
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  rust-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, "${{ needs.changes.outputs.runner_pool || 'jope-ci' }}"]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane rust-check --output "$evidence" --backend rust -- bash ops/ci/fast-lane.sh rust-check
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  rust-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Rust subprocess/timeout contracts need native x86-64; Rosetta returns exit 127
    # for a missing executable instead of ENOENT. Keep both complete test slices on
    # existing native Linux slots, preserving every test and timeout.
    runs-on: [self-hosted, linux, x64, jope-ci, "${{ matrix.shard == 1 && 'xbabe1-ci2' || 'xbabe2-ci' }}"]
    timeout-minutes: 45
    # Two deterministic nextest slices of the unchanged selection, one per jope-ci runner. Both
    # always finish so every failure is reported; the aggregate job proves (check_test_partition.py)
    # that the slices select and execute the unsharded rust-test set exactly once between them.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      JOPE_PARITY_STRICT: "1"
      OMP_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      JOPE_RUST_TEST_PARTITION: slice:${{ matrix.shard }}/2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB-$SHARD"
          python3 deploy/ci/receipt.py --lane rust-test --output "$evidence" --backend nextest --junit "$evidence/junit.xml" -- bash ops/ci/fast-lane.sh rust-test
        env:
          SHARD: ${{ matrix.shard }}
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}-${{ matrix.shard }}/

  emitters:
    needs: changes
    if: needs.changes.outputs.emitters == 'true'
    runs-on: [self-hosted, linux, x64, "${{ needs.changes.outputs.runner_pool || 'jope-ci' }}"]
    timeout-minutes: 30
    env:
      JOPE_PARITY_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane emitters --output "$evidence" --backend rust -- bash ops/ci/fast-lane.sh emitters
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  inputs:
    needs: changes
    if: needs.changes.outputs.inputs == 'true'
    runs-on: [self-hosted, linux, x64, "${{ needs.changes.outputs.runner_pool || 'jope-ci' }}"]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane inputs --output "$evidence" --backend none -- bash ops/ci/fast-lane.sh inputs
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: [self-hosted, linux, x64, "${{ needs.changes.outputs.runner_pool || 'jope-ci' }}"]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane python --output "$evidence" --backend pytest --junit "$evidence/junit.xml" -- bash ops/ci/fast-lane.sh python
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  e2e-smoke:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: [self-hosted, linux, x64, "${{ needs.changes.outputs.runner_pool || 'jope-ci' }}"]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Run declared lane and retain receipt
        id: lane
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB"
          python3 deploy/ci/receipt.py --lane e2e-smoke --output "$evidence" --backend none -- bash ops/ci/fast-lane.sh e2e-smoke
      - name: Upload current lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/

  observatory-ui:
    needs: changes
    runs-on: [self-hosted, linux, x64, "${{ needs.changes.outputs.runner_pool || 'jope-ci' }}"]
    timeout-minutes: 25
    env:
      JOPE_UI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Node 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.1.0'
      - name: Typecheck, nonzero tests and production build
        working-directory: web/training-dashboard
        shell: bash
        run: |
          set -euo pipefail
          export JOPE_UI_EVIDENCE="$GITHUB_WORKSPACE/target/observatory-ui/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mkdir -p "$JOPE_UI_EVIDENCE"
          test "$(git rev-parse HEAD)" = "$JOPE_UI_SOURCE_SHA"
          node --version
          npm --version
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- --reporter=json --outputFile="$JOPE_UI_EVIDENCE/tests.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync(`${process.env.JOPE_UI_EVIDENCE}/tests.json`, 'utf8'));
          if (!(r.numTotalTests > 0) || r.numFailedTests !== 0 || !r.success) throw new Error('Nonzero passing frontend tests required');
          fs.writeFileSync(`${process.env.JOPE_UI_EVIDENCE}/receipt.json`, JSON.stringify({schema:'jope.observatory-ui-ci/v1', source_sha:process.env.JOPE_UI_SOURCE_SHA, run_id:process.env.GITHUB_RUN_ID, attempt:process.env.GITHUB_RUN_ATTEMPT, node:process.version, executed:r.numTotalTests, passed:r.numPassedTests, failed:r.numFailedTests, scope:'frontend fixtures; not live training qualification'}, null, 2));
          JS
          npm run build
          sha256sum package-lock.json dist/index.html dist/assets/* > "$JOPE_UI_EVIDENCE/build-sha256.txt"
      - name: Rendered UX, keyboard navigation and accessibility
        working-directory: web/training-dashboard
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: |
          set -euo pipefail
          export JOPE_UX_EVIDENCE="$GITHUB_WORKSPACE/target/observatory-ui/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/rendered"
          export PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/target/browser-cache/playwright"
          native_receipt="$JOPE_UX_EVIDENCE/browser-dependencies.json"
          runtime=$(python3 "$GITHUB_WORKSPACE/deploy/ci/browser-deps.py" --cache "$GITHUB_WORKSPACE/target/tool-cache/chromium-dependencies" --receipt "$native_receipt")
          export LD_LIBRARY_PATH="$runtime/usr/lib/x86_64-linux-gnu:$runtime/lib/x86_64-linux-gnu:$runtime/usr/lib:$runtime/lib"
          FONTCONFIG_FILE=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["fontconfig"])' "$native_receipt")
          export FONTCONFIG_FILE
          npx playwright install --only-shell chromium
          npm run test:rendered
          checkout_sha=$(git rev-parse HEAD)
          test "$checkout_sha" = "$JOPE_UI_SOURCE_SHA"
          python3 "$GITHUB_WORKSPACE/deploy/ci/rendered-ux-receipt.py" create --root "$JOPE_UX_EVIDENCE" --source-sha "$JOPE_UI_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --checkout-sha "$checkout_sha" --event-sha "$GITHUB_SHA"
      - name: Retain exact-head frontend evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: observatory-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/observatory-ui/${{ github.run_id }}/${{ github.run_attempt }}/

  typescript:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.emitters == 'true'
    uses: ./.github/workflows/typescript.yml

  paper:
    uses: ./.github/workflows/paper.yml

  go:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.emitters == 'true'
    uses: ./.github/workflows/go.yml

  export-parity:
    if: github.repository == 'neverhuman/JopeDime' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/export-parity.yml

  aggregate:
    needs: [changes, hygiene, rust-check, rust-test, emitters, inputs, python, e2e-smoke, observatory-ui, paper, typescript, go, export-parity]
    if: always()
    runs-on: [self-hosted, linux, x64, "${{ needs.changes.outputs.runner_pool || 'jope-ci' }}"]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      # Evidence arrives through run/attempt-scoped cache entries (no artifact storage); each unit
      # lands in its own directory under ci-download, exactly the layout aggregate.py verifies.
      - name: Collect changes evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-changes
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/changes/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect hygiene evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-hygiene
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/hygiene/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect rust-check evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-rust-check
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/rust-check/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect rust-test-1 evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-rust-test-1
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/rust-test-1/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect rust-test-2 evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-rust-test-2
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/rust-test-2/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect emitters evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-emitters
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/emitters/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect inputs evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-inputs
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/inputs/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect python evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-python
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/python/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect e2e-smoke evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e-smoke
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/e2e-smoke/
          into: target/ci-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect publication evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/paper/
          into: target/ci-paper-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Require exact-head complete publication evidence
        if: always()
        env:
          PAPER_RESULT: ${{ needs.paper.result }}
        run: |
          set -euo pipefail
          test "$PAPER_RESULT" = success
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('target/ci-paper-download') / os.environ['GITHUB_RUN_ID'] / os.environ['GITHUB_RUN_ATTEMPT']
          paths = list(root.rglob('receipt.json'))
          assert len(paths) == 1, 'one publication receipt required'
          path = paths[0]; r = json.loads(path.read_text())
          assert r['schema'] == 'jope.ci-receipt/v1' and r['lane'] == 'paper'
          assert r['source_sha'] == os.environ['JOPE_SOURCE_SHA']
          assert r['checkout_sha'] == os.environ['GITHUB_SHA']
          assert r['run_id'] == os.environ['GITHUB_RUN_ID'] and type(r['attempt']) is int and 1 <= r['attempt'] <= int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert r['event'] == os.environ['GITHUB_EVENT_NAME']
          assert r['status'] == 'passed' and r['exit_status'] == 0 and not r.get('diagnostic')
          assert r['dirty_source'] == r['dirty_source_after'] == []
          assert r['command'] == ['make', '-C', 'docs/paper/innovationzero', 'check', 'self-test', 'pdf']
          names = ['InnovationZero', 'InnovationZero-Supplement', 'InnovationZero-Archive']
          required = {'command.log', 'evidence/build-environment.txt', 'evidence/source-identity.json', 'evidence/dependencies.json', 'evidence/format.log'}
          required.update('evidence/' + n + ext for n in names for ext in ('.pdf', '.log'))
          assert required <= set(r['evidence'])
          actual = {str(p.relative_to(path.parent)) for p in path.parent.rglob('*') if p.is_file() and p != path}
          assert actual == set(r['evidence'])
          for name, sha in r['evidence'].items():
              member = path.parent / name
              assert not pathlib.Path(name).is_absolute() and '..' not in pathlib.Path(name).parts
              assert not member.is_symlink() and member.resolve().is_relative_to(path.parent.resolve())
              assert hashlib.sha256(member.read_bytes()).hexdigest() == sha
          identity = json.loads((path.parent / 'evidence/source-identity.json').read_text())
          assert identity['schema'] == 'jope.publication-source/v1'
          assert identity['source_sha'] == r['source_sha']
          assert identity['checkout_sha'] == identity['event_sha'] == r['checkout_sha']
          assert identity['run_id'] == r['run_id'] and identity['attempt'] == r['attempt'] and identity['event'] == r['event']
          import subprocess
          current_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert identity['source_tree'] == identity['checkout_tree'] == current_tree
          native = json.loads((path.parent / 'evidence/dependencies.json').read_text())
          assert native['lock_sha256'] == hashlib.sha256(pathlib.Path('deploy/ci/publication-deps.lock.json').read_bytes()).hexdigest()
          print('Exact-head publication, three PDFs, TeX logs, refusal checks and verified toolchain retained')
          PY
      - name: Collect frontend evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: observatory-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/observatory-ui/${{ github.run_id }}/${{ github.run_attempt }}/
          into: target/ci-ui-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Require exact-head nonzero frontend tests
        if: always()
        env:
          UI_RESULT: ${{ needs.observatory-ui.result }}
        run: |
          set -euo pipefail
          test "$UI_RESULT" = success
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('target/ci-ui-download') / os.environ['GITHUB_RUN_ID'] / os.environ['GITHUB_RUN_ATTEMPT']
          receipts = list(root.rglob('receipt.json'))
          assert len(receipts) == 1, 'one retained frontend receipt required'
          r = json.loads(receipts[0].read_text())
          assert r['schema'] == 'jope.observatory-ui-ci/v1'
          assert r['source_sha'] == os.environ['JOPE_SOURCE_SHA']
          assert r['run_id'] == os.environ['GITHUB_RUN_ID'] and isinstance(r['attempt'], str) and r['attempt'].isdecimal() and 1 <= int(r['attempt']) <= int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert r['executed'] > 0 and r['passed'] == r['executed'] and r['failed'] == 0
          print('Exact-head frontend tests:', r['executed'], 'passed')
          PY
      - name: Require exact-head complete rendered UX evidence
        if: always()
        run: |
          set -euo pipefail
          root="target/ci-ui-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          rendered_root=$(python3 -c 'import pathlib,sys; p=list(pathlib.Path(sys.argv[1]).rglob("rendered-receipt.json")); assert len(p)==1, "one rendered receipt required"; print(p[0].parent)' "$root")
          ui_attempt=$(python3 -c 'import json,os,pathlib,sys; p=list(pathlib.Path(sys.argv[1]).rglob("receipt.json")); assert len(p)==1; a=json.loads(p[0].read_text())["attempt"]; assert isinstance(a,str) and a.isdecimal() and 1<=int(a)<=int(os.environ["GITHUB_RUN_ATTEMPT"]); print(a)' "$root")
          # UI checks out the source head explicitly; aggregate may use a synthetic PR merge.
          python3 deploy/ci/rendered-ux-receipt.py verify --root "$rendered_root" --source-sha "$JOPE_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$ui_attempt" --checkout-sha "$JOPE_SOURCE_SHA" --event-sha "$GITHUB_SHA"
      - name: Collect TypeScript Node 24.19.0 evidence
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.emitters == 'true'
        uses: ./.github/actions/download-ci-evidence
        with:
          name: typescript-${{ github.run_id }}-${{ github.run_attempt }}-24.19.0
          path: target/typescript-evidence/
          layout: name
          into: target/ci-typescript-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect TypeScript Node 26.1.0 evidence
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.emitters == 'true'
        uses: ./.github/actions/download-ci-evidence
        with:
          name: typescript-${{ github.run_id }}-${{ github.run_attempt }}-26.1.0
          path: target/typescript-evidence/
          layout: name
          into: target/ci-typescript-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Require both exact-source TypeScript matrix receipts
        if: always() && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.emitters == 'true')
        env:
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
        run: |
          set -euo pipefail
          test "$TYPESCRIPT_RESULT" = success
          for version in 24.19.0 26.1.0; do
            root="target/ci-typescript-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/typescript-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$version"
            node deploy/ci/typescript/evidence.mjs verify "$root" "$version"
          done
      - name: Collect hosted export parity evidence
        if: github.repository == 'neverhuman/JopeDime' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/download-ci-evidence
        with:
          name: export-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/export-parity/${{ github.run_id }}/${{ github.run_attempt }}
          into: target/ci-export-parity/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Verify exact-source hosted export parity
        if: always() && github.repository == 'neverhuman/JopeDime' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          EXPORT_RESULT: ${{ needs.export-parity.result }}
        run: |
          set -euo pipefail
          test "$EXPORT_RESULT" = success
          python3 - <<'PYVERIFY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('target/ci-export-parity') / os.environ['GITHUB_RUN_ID'] / os.environ['GITHUB_RUN_ATTEMPT']
          paths = list(root.rglob('report.json'))
          assert len(paths) == 1, 'one hosted parity report required'
          path = paths[0]; r = json.loads(path.read_text())
          assert r['schema'] == 'jope.export-parity/v1' and r['status'] == 'pass' and r['passed'] is True
          assert r['ci_executed'] is True and r['source_stable'] is True and not r['source_dirty']
          assert r['source_sha'] == r['source_end'] == os.environ['JOPE_SOURCE_SHA']
          assert r['harness_sha256'] == hashlib.sha256(pathlib.Path('deploy/ci/export-parity.sh').read_bytes()).hexdigest()
          assert r['cargo_lock_sha256'] == hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest()
          c = r['ci_context']
          assert c['GITHUB_REPOSITORY'] == os.environ['GITHUB_REPOSITORY'] == 'neverhuman/JopeDime'
          assert c['GITHUB_EVENT_NAME'] == os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert c['GITHUB_RUN_ID'] == os.environ['GITHUB_RUN_ID']
          assert c['GITHUB_RUN_ATTEMPT'] == os.environ['GITHUB_RUN_ATTEMPT']
          assert r['fault_injected'] is False
          assert r['toolchains']['rustc'].startswith('rustc 1.97.1 ')
          assert r['toolchains']['python'] == 'Python 3.12.3' and r['toolchains']['node'] == 'v26.1.0'
          registry = json.loads((path.parent / 'registry.json').read_text())
          assert hashlib.sha256((path.parent / 'registry.json').read_bytes()).hexdigest() == r['registry_sha256']
          assert hashlib.sha256((path.parent / 'fixtures.json').read_bytes()).hexdigest() == r['fixture_sha256']
          expected = {(x['kind'].capitalize() + '/' + x['name'], lang): admitted for x in registry['entries'] for lang, admitted in x['supported'].items()}
          cells = r['cells']; supported = [x for x in cells if x['supported']]
          assert {(x['key'], x['language']): x['supported'] for x in cells} == expected
          assert len({(x['key'], x['language']) for x in cells}) == len(cells)
          assert len(supported) > 0 and all(x['status'] == 'pass' for x in supported)
          assert r['expected_supported_cells'] == r['executed_supported_cells'] == len(supported)
          assert all(x['status'] == 'unsupported_registry' for x in cells if not x['supported'])
          cases = r['cases']
          assert r['expected_emitted_modules'] == r['executed_emitted_modules'] == len(cases) > 0
          assert all(x['status'] == 'pass' and x['self_check_rows'] == 64 for x in cases)
          assert {x['language'] for x in cases} == {'rust', 'python', 'javascript'}
          routing = [x for x in cases if x.get('decision_measurement')]
          assert routing and all(x['golden_flip_rate'] == 0 and x['randomized_flip_rate'] <= .001 for x in routing)
          assert len(r['raw_numeric_contract']) == 3 and all(x['status'] == 'pass' and x['rows'] > 0 for x in r['raw_numeric_contract'])
          commands = r['commands']; assert commands and all(type(x['exit']) is int for x in commands)
          for command in commands:
              assert {'argv', 'exit', 'stdout', 'stderr', 'seconds'} <= command.keys()
              assert command['argv'] and command['stdout'] in r['files'] and command['stderr'] in r['files']
          actual = {str(x.relative_to(path.parent)) for x in path.parent.rglob('*') if x.is_file() and x != path and x != path.parent / 'MANIFEST.sha256'}
          assert actual == set(r['files']), 'complete generated predictor/model/subprocess inventory'
          assert {'harness.sh', 'generate.rs', 'registry.json', 'fixtures.json'} <= r['files'].keys()
          assert any(name.endswith('/model.json') for name in r['files'])
          for extension in ('rs', 'py', 'mjs'):
              assert any(name.endswith('/predictor.' + extension) for name in r['files'])
          for name, item in r['files'].items():
              member = path.parent / name
              assert not pathlib.Path(name).is_absolute() and '..' not in pathlib.Path(name).parts
              assert not member.is_symlink() and member.resolve().is_relative_to(path.parent.resolve())
              assert member.stat().st_size == item['bytes']
              assert hashlib.sha256(member.read_bytes()).hexdigest() == item['sha256']
          print('Hosted export parity:', len(supported), 'supported cells;', len(cases), 'emitted modules; source/run/attempt and every file verified')
          PYVERIFY
      - name: Retain hosted export parity on aggregate runner
        if: always() && github.repository == 'neverhuman/JopeDime' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: export-parity-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-export-parity/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Validate every required result
        if: always()
        env:
          EXPORT_RESULT: ${{ needs.export-parity.result }}
          EXPORT_REQUIRED: ${{ github.repository == 'neverhuman/JopeDime' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
          GO_RESULT: ${{ needs.go.result }}
          GO_REQUIRED: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.emitters == 'true' }}
          NEEDS_JSON: ${{ toJson(needs) }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          TYPESCRIPT_REQUIRED: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.emitters == 'true' }}
        run: |
          set -euo pipefail
          output="target/ci-aggregate/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mkdir -p "$output"
          printf '%s\n' "$NEEDS_JSON" > "$output/all-needs.json"
          expected=skipped
          if [ "$GO_REQUIRED" = true ]; then expected=success; fi
          test "$GO_RESULT" = "$expected"
          expected=skipped
          if [ "$TYPESCRIPT_REQUIRED" = true ]; then expected=success; fi
          test "$TYPESCRIPT_RESULT" = "$expected"
          expected=skipped
          if [ "$EXPORT_REQUIRED" = true ]; then expected=success; fi
          test "$EXPORT_RESULT" = "$expected"
          # UI, publication, language and export evidence are independently verified above.
          python3 -c 'import json,os; n=json.loads(os.environ["NEEDS_JSON"]); n.pop("observatory-ui"); n.pop("paper"); n.pop("go"); n.pop("typescript"); n.pop("export-parity"); print(json.dumps(n))' > "$output/needs.json"
          python3 deploy/ci/aggregate.py --receipts "target/ci-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --needs "$output/needs.json" --output "$output/aggregate.json"
      # aggregate.py already fails on this; the separate report is the retained proof.
      - name: Rust test slices cover the unsharded rust-test set exactly once
        if: always() && needs.changes.outputs.rust == 'true'
        run: |
          set -euo pipefail
          output="target/ci-aggregate/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mkdir -p "$output"
          python3 deploy/ci/check_test_partition.py rust-shards --receipts "target/ci-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --output "$output/rust-test-partition.json"
      - name: Upload aggregate inventory
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ci-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-aggregate/${{ github.run_id }}/${{ github.run_attempt }}/
