name: Clean-host D1 Linux and macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64-prestage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 8
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and package Linux fixture
        run: bash ops/ci/clean-host.sh linux-prestage
      - name: Exercise isolated Linux clean-host D1
        run: bash ops/ci/clean-host.sh linux-exercise

  macos-arm64-pending:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 8
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, package and exercise native macOS arm64 D1
        run: nice -n 10 bash ops/ci/clean-host.sh macos

  windows-x86_64-pending:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Windows support waived by the owner; this disabled mapping is retained for coverage inventory compatibility."
