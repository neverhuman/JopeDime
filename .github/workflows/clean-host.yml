name: Clean-host D1 pre-stage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64-prestage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build local engine candidate
        run: nice -n 10 cargo build --locked -p jope-appliance --bin jopedime
      - name: Exercise synthetic Linux clean-host pre-stage
        run: |
          # Ubuntu restricts unprivileged user namespaces. Keep the output private to namespace root.
          sudo install -d -m 0700 target/rel-04
          sudo env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory \
            "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" \
            bash deploy/appliance/test-clean-host.sh \
            target/debug/jopedime target/rel-04/clean-host --prestage

  macos-arm64-pending:
    if: ${{ false }}
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - run: echo "Pending owner-authorized macOS arm64 D1 qualification."

  windows-x86_64-pending:
    if: ${{ false }}
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - run: echo "Pending owner-authorized Windows x86-64 D1 qualification."
