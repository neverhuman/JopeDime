name: cuda
on:
  workflow_call:
    inputs:
      run-device:
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  cuda-parity:
    # Reuse ci.yml's admitted PR/manual execution context; no host policy change.
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [host, compile]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_CODEGEN_UNITS: '1'
      CARGO_BUILD_JOBS: '2'
      JOPE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Install hash-pinned build tools and official CUDA compiler
        run: bash deploy/ci/cuda/compiler-tools.sh '${{ matrix.mode }}' 
      - name: Full recipe, fitted, versioned, lifecycle and source-binding qualification
        run: bash deploy/ci/cuda/qualify.sh '${{ matrix.mode }}'
      - name: Retain exact-source results
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: cuda-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}
          path: target/cuda-evidence/${{ matrix.mode }}/

  cuda-device:
    # Explicit full manual qualification on the existing GPU runner label.
    # A skipped job supplies no device evidence and is never called a GPU pass.
    if: inputs.run-device
    runs-on: [self-hosted, linux, x64, xbabe2-gpu]
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_CODEGEN_UNITS: '1'
      CARGO_BUILD_JOBS: '2'
      JOPE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Execute actual device parity
        run: bash deploy/ci/cuda/qualify.sh device
      - name: Retain actual device evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: cuda-${{ github.run_id }}-${{ github.run_attempt }}-device
          path: target/cuda-evidence/device/
