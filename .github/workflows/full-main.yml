name: full-main-cpu
on:
  workflow_dispatch:
permissions:
  contents: read

# Serialize duplicate invocations of this source without cancelling running proof.
# Different main SHAs have different groups, so newer pushes cannot evict older heads.
concurrency:
  group: full-main-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "8"
  JOPE_SOURCE_SHA: ${{ github.sha }}
  JOPE_PARITY_STRICT: "1"
  OMP_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

# Fixed full slots serialize jobs per host. No concurrency group discards pending pushes.
jobs:
  cpu:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, jope-full-cpu]
    # The 11 bounded families total 137.75min including kill grace; each group runs a subset of
    # them, so the job deadline still retains >=5min for uploads.
    timeout-minutes: 145
    strategy:
      # Groups are independent outcomes, as families are within a group: one failing group must
      # not cancel the other. deploy/ci/full-main.py GROUPS is the partition; the aggregate job
      # and check_test_partition.py prove it covers every declared family exactly once.
      fail-fast: false
      matrix:
        group: [cpu-1, cpu-2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance and approved resources
        uses: ./.github/actions/runner-provenance
      - name: Trusted full-lane compiler cache
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python3 deploy/ci/full-main.py cache-setup --output "target/full-cpu-cache/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GROUP"
      - name: Execute every family of this group independently
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python3 deploy/ci/full-main.py run --group "$GROUP" --output "target/full-cpu/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GROUP"
      - name: Inventory every result including failed or missing families
        if: always()
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python3 deploy/ci/full-main.py summarize --group "$GROUP" --output "target/full-cpu/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GROUP"
      - name: Retain compiler cache hits and misses
        if: always()
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python3 deploy/ci/full-main.py cache-stats --output "target/full-cpu/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GROUP/compiler-cache"
      - name: Upload fresh run evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: full-cpu-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
          path: target/full-cpu/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.group }}/

  macos-arm64:
    # Native macOS arm64 leg of the full CI on the self-hosted xbabe4 Mac (a launchd user-service
    # runner, not the Linux guest lanes). The Linux families stay on jope-full-cpu trusted storage,
    # where the cpu matrix already fans out across every full host (xbabe2, xbabe3).
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, jope-macos]
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "8"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, package and exercise native macOS arm64 D1
        run: nice -n 10 bash ops/ci/clean-host.sh macos

  paper:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/paper.yml
    with:
      runner-label: jope-full-cpu

  aggregate:
    needs: [cpu, paper]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, jope-full-cpu]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner provenance and approved resources
        uses: ./.github/actions/runner-provenance
      - name: Require publication build
        env:
          PAPER_RESULT: ${{ needs.paper.result }}
        run: test "$PAPER_RESULT" = success
      - name: Collect cpu-1 evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: full-cpu-${{ github.run_id }}-${{ github.run_attempt }}-cpu-1
          path: target/full-cpu/${{ github.run_id }}/${{ github.run_attempt }}/cpu-1/
          layout: name
          into: target/full-cpu-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Collect cpu-2 evidence
        uses: ./.github/actions/download-ci-evidence
        with:
          name: full-cpu-${{ github.run_id }}-${{ github.run_attempt }}-cpu-2
          path: target/full-cpu/${{ github.run_id }}/${{ github.run_attempt }}/cpu-2/
          layout: name
          into: target/full-cpu-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Every declared family verified exactly once across the groups
        if: always()
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          output="target/full-cpu-aggregate/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mkdir -p "$output"
          printf '%s\n' "$NEEDS_JSON" > "$output/all-needs.json"
          python3 -c 'import json,os; n=json.loads(os.environ["NEEDS_JSON"]); n.pop("paper"); print(json.dumps(n))' > "$output/needs.json"
          python3 deploy/ci/full-main.py aggregate --downloads "target/full-cpu-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --needs "$output/needs.json" --output "$output"
      - name: Upload aggregate inventory
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: full-cpu-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/full-cpu-aggregate/${{ github.run_id }}/${{ github.run_attempt }}/

  audit:
    # Reuse the admitted trusted-main workflow; no new runner/host admission.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, jope-full-cpu]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner provenance and approved resources
        uses: ./.github/actions/runner-provenance
      - name: Install pinned full-source auditor
        run: bash deploy/ci/install-jankurai.sh
      - name: Full default-policy Jankurai audit and source re-verification
        env:
          JANKURAI_NO_UPDATE_CHECK: "1"
          JANKURAI_BIN: ${{ github.workspace }}/target/jankurai/jankurai-1.7.5-x86_64-unknown-linux-gnu/jankurai
          # Owner decision 2026-10-22: report-only until the score reaches 85 (54 at bdf9441aa).
          # Integrity and consistency failures still fail; remove this line at 85.
          JOPE_AUDIT_REPORT_ONLY: "1"
        run: |
          bash ops/ci/jankurai.sh "target/full-audit/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
      - name: Retain complete audit evidence including failed gates
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: full-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/full-audit/${{ github.run_id }}/${{ github.run_attempt }}/
      - name: Leave the persistent workspace deletable for the next checkout
        if: always()
        run: if [ -d target/full-audit ]; then chmod -R u+w target/full-audit; fi
