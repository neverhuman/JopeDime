name: full-main-cpu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "8"
  JOPE_SOURCE_SHA: ${{ github.sha }}
  JOPE_PARITY_STRICT: "1"
  OMP_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

# Fixed full slots serialize jobs per host. No concurrency group discards pending pushes.
jobs:
  cpu:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, jope-full-cpu]
    # The 11 bounded families total 122.75min including kill grace; each group runs a subset of
    # them, so the unchanged job deadline still retains >=5min for uploads.
    timeout-minutes: 130
    strategy:
      # Groups are independent outcomes, as families are within a group: one failing group must
      # not cancel the other. deploy/ci/full-main.py GROUPS is the partition; the aggregate job
      # and check_test_partition.py prove it covers every declared family exactly once.
      fail-fast: false
      matrix:
        group: [cpu-1, cpu-2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance and approved resources
        uses: ./.github/actions/runner-provenance
      - name: Trusted full-lane compiler cache
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python3 deploy/ci/full-main.py cache-setup --output "target/full-cpu-cache/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GROUP"
      - name: Execute every family of this group independently
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python3 deploy/ci/full-main.py run --group "$GROUP" --output "target/full-cpu/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GROUP"
      - name: Inventory every result including failed or missing families
        if: always()
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python3 deploy/ci/full-main.py summarize --group "$GROUP" --output "target/full-cpu/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GROUP"
      - name: Retain compiler cache hits and misses
        if: always()
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python3 deploy/ci/full-main.py cache-stats --output "target/full-cpu/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GROUP/compiler-cache"
      - name: Upload fresh run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-cpu-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
          path: target/full-cpu/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.group }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  aggregate:
    needs: cpu
    if: always() && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, jope-full-cpu]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner provenance and approved resources
        uses: ./.github/actions/runner-provenance
      # Same bounded download as ci.yml's aggregate: at most three attempts, each from an empty
      # directory, and exactly one complete attempt is required.
      - name: Download this run and attempt only (attempt 1)
        id: download-first
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          pattern: full-cpu-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: target/full-cpu-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Clear the partial download before attempt 2
        if: steps.download-first.outcome == 'failure'
        run: rm -rf -- "target/full-cpu-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
      - name: Download this run and attempt only (attempt 2)
        id: download-second
        if: steps.download-first.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          pattern: full-cpu-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: target/full-cpu-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Clear the partial download before attempt 3
        if: steps.download-first.outcome == 'failure' && steps.download-second.outcome == 'failure'
        run: rm -rf -- "target/full-cpu-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
      - name: Download this run and attempt only (attempt 3)
        id: download-third
        if: steps.download-first.outcome == 'failure' && steps.download-second.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          pattern: full-cpu-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: target/full-cpu-download/${{ github.run_id }}/${{ github.run_attempt }}
      - name: Require one complete bounded download
        env:
          FIRST: ${{ steps.download-first.outcome }}
          SECOND: ${{ steps.download-second.outcome }}
          THIRD: ${{ steps.download-third.outcome }}
        run: bash deploy/ci/publication-status.sh "$FIRST" "$SECOND" "$THIRD"
      - name: Every declared family verified exactly once across the groups
        if: always()
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          output="target/full-cpu-aggregate/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mkdir -p "$output"
          printf '%s\n' "$NEEDS_JSON" > "$output/needs.json"
          python3 deploy/ci/full-main.py aggregate --downloads "target/full-cpu-download/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --needs "$output/needs.json" --output "$output"
      - name: Upload aggregate inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-cpu-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/full-cpu-aggregate/${{ github.run_id }}/${{ github.run_attempt }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
