name: go
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: go-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  go-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.12', '1.26.10']
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_CODEGEN_UNITS: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Prepare and check complete source
        shell: bash
        run: bash ops/ci/go.sh preflight
      - name: Native sanitizer contracts
        if: matrix.go == '1.26.10'
        run: bash ops/ci/go.sh sanitizer
      - name: Full parity, registry census, publication and coverage
        run: bash ops/ci/go.sh qualify
      - name: Race detector on the actual emitted API
        env:
          CGO_ENABLED: '1'
        run: bash ops/ci/go.sh race
      - name: Bounded lifecycle fuzzing
        env:
          CGO_ENABLED: '0'
          GOMAXPROCS: '2'
        run: bash ops/ci/go.sh fuzz
      - name: Pure Go deployment builds
        shell: bash
        run: bash ops/ci/go.sh examples
      - name: Retain qualification evidence
        id: save-1
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: go-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.go }}
          path: |
            target/go-evidence/
            target/go-contract/coverage.out
      - name: Verify evidence publication
        id: first
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: go-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.go }}
          path: |
            target/go-evidence/
            target/go-contract/coverage.out
          lookup-only: true
          fail-on-cache-miss: true
      - name: Retain qualification evidence (attempt 2)
        id: save-2
        if: ${{ !cancelled() && steps.first.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: go-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.go }}-pub-2
          path: |
            target/go-evidence/
            target/go-contract/coverage.out
      - name: Verify evidence publication (attempt 2)
        id: second
        if: ${{ !cancelled() && steps.first.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: go-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.go }}-pub-2
          restore-keys: |
            go-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.go }}
          path: |
            target/go-evidence/
            target/go-contract/coverage.out
          lookup-only: true
          fail-on-cache-miss: true
      - name: Retain qualification evidence (attempt 3)
        id: save-3
        if: ${{ !cancelled() && steps.first.outcome == 'failure' && steps.second.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: go-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.go }}-pub-3
          path: |
            target/go-evidence/
            target/go-contract/coverage.out
      - name: Verify evidence publication (attempt 3)
        id: third
        if: ${{ !cancelled() && steps.first.outcome == 'failure' && steps.second.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: go-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.go }}-pub-3
          restore-keys: |
            go-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.go }}
          path: |
            target/go-evidence/
            target/go-contract/coverage.out
          lookup-only: true
          fail-on-cache-miss: true
      - name: Require successful evidence publication
        if: always()
        shell: bash
        env:
          FIRST: ${{ steps.first.outcome }}
          SECOND: ${{ steps.second.outcome }}
          THIRD: ${{ steps.third.outcome }}
        run: bash deploy/ci/publication-status.sh "$FIRST" "$SECOND" "$THIRD"
  go-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_CODEGEN_UNITS: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: '2'
      JOPE_GO_PARITY: '1'
      CGO_ENABLED: '0'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.26.10'
          cache: false
      - name: Native host, both engines, complete registry and contracts
        shell: bash
        run: bash ops/ci/go.sh platform
