name: Full Jankurai audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jankurai-audit:
    # Hosted ubuntu-24.04 runners do not schedule on this private repository, and
    # self-hosted runner admission (deploy/runner/job-policy.py) admits only
    # ci.yml, full-main.yml, and main-guard.yml. Gate hosted execution behind
    # vars.JANKURAI_HOSTED_RUNNER until a self-hosted jankurai lane is admitted.
    if: vars.JANKURAI_HOSTED_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Jankurai v1.7.5
        run: |
          set -euo pipefail
          bash deploy/ci/install-jankurai.sh
          echo "$PWD/target/jankurai/jankurai-1.7.5-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Run full Jankurai v1.7.5 audit
        run: |
          set -euo pipefail
          bash ops/ci/jankurai.sh "$PWD/target/jankurai/reports/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"

      - name: Retain Jankurai audit evidence (no GitHub artifact storage)
        if: always()
        env:
          JOPE_LOCAL_EVIDENCE_ROOT: ${{ runner.temp }}/jope-evidence
          NAME: jankurai-${{ github.run_id }}-${{ github.run_attempt }}
          SRC: target/jankurai/reports/${{ github.run_id }}/${{ github.run_attempt }}
        run: bash deploy/ci/retain-local-evidence.sh "$NAME" "$SRC"
