name: lite-client
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lite-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lite-client:
    runs-on: [self-hosted, linux, x64, jope-ci, xbabe1-ci]
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: '8'
      RAYON_NUM_THREADS: '8'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      JOPE_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Build the lite executable and verify its normal graph
        shell: bash
        run: bash ops/ci/lite-client.sh build
      - name: Run transport contracts against the background fixture engine
        shell: bash
        run: bash ops/ci/lite-client.sh contracts
      - name: Retain source-bound lite build and contract evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: lite-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/
