name: InnovationZero publication

on:
  workflow_call:
    inputs:
      runner-label:
        type: string
        default: jope-ci

permissions:
  contents: read

jobs:
  build:
    # The caller is ci.yml or trusted-main full-main.yml, using existing admission.
    runs-on: [self-hosted, linux, x64, "${{ inputs.runner-label }}"]
    timeout-minutes: 30
    env:
      JOPE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance

      # Fonts are fetched by scripts/build.sh from the release archives pinned in fonts.lock and
      # verified by SHA-256 before use; nothing else in the build reads the network.
      - name: Check sources, exercise refusals, and build the three PDFs
        run: |
          set -euo pipefail
          evidence="target/ci-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/paper"
          build="target/innovationzero-paper"
          mkdir -p "$build"
          # Keep GITHUB_SHA honest: PR jobs use the native synthetic merge checkout.
          # A separate strict tree comparison proves it contains exactly the reviewed source.
          if ! git cat-file -e "$JOPE_SOURCE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$JOPE_SOURCE_SHA"
          fi
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          source = os.environ['JOPE_SOURCE_SHA']; checkout = git('rev-parse', 'HEAD')
          assert checkout == os.environ['GITHUB_SHA'], 'native event checkout required'
          source_tree = git('rev-parse', source + '^{tree}')
          checkout_tree = git('rev-parse', 'HEAD^{tree}')
          assert source_tree == checkout_tree, 'PR merge tree differs from reviewed source; update branch first'
          pathlib.Path('target/innovationzero-paper/source-identity.json').write_text(json.dumps({
              'schema':'jope.publication-source/v1', 'source_sha':source, 'checkout_sha':checkout,
              'event_sha':os.environ['GITHUB_SHA'], 'source_tree':source_tree, 'checkout_tree':checkout_tree,
              'run_id':os.environ['GITHUB_RUN_ID'], 'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'event':os.environ['GITHUB_EVENT_NAME']}, indent=2) + '\n')
          print('Publication source/checkout trees match:', source_tree)
          PY
          export JOPE_PAPER_NATIVE_EVIDENCE="$build/native/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          bash deploy/ci/publication-tools.sh python3 deploy/ci/receipt.py --lane paper --output "$evidence" --backend none \
            --evidence "$build/InnovationZero.pdf" \
            --evidence "$build/InnovationZero-Supplement.pdf" \
            --evidence "$build/InnovationZero-Archive.pdf" \
            --evidence "$build/InnovationZero.log" \
            --evidence "$build/InnovationZero-Supplement.log" \
            --evidence "$build/InnovationZero-Archive.log" \
            --evidence "$build/build-environment.txt" \
            --evidence "$build/source-identity.json" \
            --evidence "$JOPE_PAPER_NATIVE_EVIDENCE/dependencies.json" \
            --evidence "$JOPE_PAPER_NATIVE_EVIDENCE/format.log" \
            -- make -C docs/paper/innovationzero check self-test pdf

      - name: Retain publication PDFs, logs, and source-bound receipt
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        env:
          JOPE_LOCAL_EVIDENCE_ROOT: ${{ runner.temp }}/jope-paper-evidence
        with:
          name: paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/paper/

      - name: Explain evidence retrieval
        if: always()
        run: |
          {
            echo '### InnovationZero publication outputs'
            echo 'The source-bound receipt contains the three PDFs, TeX logs, build environment, and check output.'
            echo 'Evidence uses the existing run/attempt-scoped Actions cache transport; GitHub artifact storage is not used.'
            echo 'The upload step records the cache publication and SHA-256 manifest. Restore it with the repository download-ci-evidence action using the same name and path.'
            echo 'Runner-local copies are temporary; cache availability is subject to eviction.'
          } >> "$GITHUB_STEP_SUMMARY"
