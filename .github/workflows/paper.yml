name: InnovationZero source checks

on:
  workflow_call:
    inputs:
      runner-label:
        type: string
        default: jope-ci

  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The caller is ci.yml or trusted-main full-main.yml, using existing admission.
    runs-on: [self-hosted, linux, x64, "${{ inputs.runner-label || 'jope-ci' }}"]
    timeout-minutes: 30
    env:
      JOPE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance

      # Retain the existing job ID for callers/status checks. Typesetting is an explicit
      # publication operation (`just paper`), never part of PR or full-main CI.
      - name: Check sources and exercise refusals without TeX
        run: bash ops/ci/paper.sh

      - name: Retain check output and source-bound receipt
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        env:
          JOPE_LOCAL_EVIDENCE_ROOT: ${{ runner.temp }}/jope-paper-evidence
        with:
          name: paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-evidence/${{ github.run_id }}/${{ github.run_attempt }}/paper/

      - name: Explain evidence retrieval
        if: always()
        run: bash ops/ci/paper-summary.sh
