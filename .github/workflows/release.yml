name: release

# Manual dispatch intentionally refuses: releases are cut by deploy/release/release.sh.
# This workflow has no release trigger and no permissions to publish release artifacts.

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize duplicate invocations of this source without cancelling running proof.
# Different main SHAs have different groups, so newer pushes cannot evict older heads.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Refuse (DISPATCH-ONLY; releases come from deploy/release/release.sh)
        run: bash ops/ci/refuse-release-workflow.sh
