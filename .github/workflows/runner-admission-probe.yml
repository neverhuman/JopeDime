name: runner-admission-probe
# Manual negative operational proof. Expected outcome is rejection, not a green job.
# Operators verify the hook denial, absent bypass marker and terminated container.
on:
  workflow_dispatch:
permissions: {}
# Serialize duplicate invocations of this source without cancelling running proof.
# Different main SHAs have different groups, so newer pushes cannot evict older heads.
concurrency:
  group: runner-admission-probe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  reject-fast:
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 2
    steps:
      - name: Must never execute after admission denial
        if: always()
        run: bash ops/ci/runner-admission-probe.sh
  reject-main:
    runs-on: [self-hosted, linux, x64, jope-full-cpu]
    timeout-minutes: 2
    steps:
      - name: Must never execute after admission denial
        if: always()
        run: bash ops/ci/runner-admission-probe.sh
