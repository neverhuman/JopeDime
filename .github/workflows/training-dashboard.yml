name: Training dashboard

on:
  pull_request:
    paths:
      - 'web/training-dashboard/**'
      - 'crates/jope-observatory/**'
      - '.github/workflows/training-dashboard.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'web/training-dashboard/**'
      - 'crates/jope-observatory/**'
      - '.github/workflows/training-dashboard.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observatory-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observatory-ui:
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 15
    env:
      JOPE_UI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Node 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.1.0'
      - name: Typecheck, nonzero tests and production build
        working-directory: web/training-dashboard
        shell: bash
        run: |
          set -euo pipefail
          export JOPE_UI_EVIDENCE="$GITHUB_WORKSPACE/target/observatory-ui/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mkdir -p "$JOPE_UI_EVIDENCE"
          test "$(git rev-parse HEAD)" = "$JOPE_UI_SOURCE_SHA"
          node --version
          npm --version
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- --reporter=json --outputFile="$JOPE_UI_EVIDENCE/tests.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync(`${process.env.JOPE_UI_EVIDENCE}/tests.json`, 'utf8'));
          if (!(r.numTotalTests > 0) || r.numFailedTests !== 0 || !r.success) throw new Error('Nonzero passing frontend tests required');
          fs.writeFileSync(`${process.env.JOPE_UI_EVIDENCE}/receipt.json`, JSON.stringify({schema:'jope.observatory-ui-ci/v1', source_sha:process.env.JOPE_UI_SOURCE_SHA, run_id:process.env.GITHUB_RUN_ID, attempt:process.env.GITHUB_RUN_ATTEMPT, node:process.version, executed:r.numTotalTests, passed:r.numPassedTests, failed:r.numFailedTests, scope:'frontend fixtures; not live training qualification'}, null, 2));
          JS
          npm run build
          sha256sum package-lock.json dist/index.html dist/assets/* > "$JOPE_UI_EVIDENCE/build-sha256.txt"
      - name: Retain exact-head frontend evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: observatory-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/observatory-ui/${{ github.run_id }}/${{ github.run_attempt }}/
