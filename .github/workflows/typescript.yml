name: typescript
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typescript-parity:
    runs-on: ubuntu-24.04
    # The existing pure-Python wide GCV oracle is intentionally expensive;
    # retain that fixture and allow the added complete census to finish too.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ['24.19.0', '26.1.0']
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: '2'
      JOPE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare pinned compilers
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
          npm ci --prefix deploy/ci/typescript --ignore-scripts --no-audit --no-fund
      - name: Formatting and complete source checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cargo fmt --all --check
          cargo check --locked -p jope-cli --no-default-features
      - name: Complete census, golden parity, 100 percent facade coverage and publication contracts
        run: bash deploy/ci/typescript/qualify.sh
      - name: Install real browser engines
        if: matrix.node == '26.1.0'
        run: deploy/ci/typescript/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Every census fixture in Chromium, Firefox, WebKit and module workers
        if: matrix.node == '26.1.0'
        env:
          JOPE_TS_BROWSERS: chromium,firefox,webkit
        run: node deploy/ci/typescript/browser.mjs
      - name: Retain qualification logs
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: typescript-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.node }}
          path: target/typescript-evidence/
      - name: Verify evidence publication
        if: always()
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: typescript-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.node }}
          path: target/typescript-evidence/
          lookup-only: true
          fail-on-cache-miss: true
