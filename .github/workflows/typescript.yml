name: typescript
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-admission:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      admitted: ${{ steps.verify.outputs.admitted }}
    steps:
      - name: Verify TypeScript workflow caller identity
        id: verify
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_BASE_REPOSITORY_ID: ${{ github.event.pull_request.base.repo.id }}
        shell: bash
        run: |
          set -euo pipefail
          refuse() {
            echo '::error::TypeScript parity admission refused; invoke through the admitted ci.yml workflow context.'
            exit 1
          }

          expected_repository='neverhuman/JopeDime'
          expected_repository_id='1376159324'
          workflow_prefix='neverhuman/JopeDime/.github/workflows/ci.yml@'

          [[ "${REPOSITORY:-}" == "$expected_repository" ]] || refuse
          [[ "${REPOSITORY_ID:-}" == "$expected_repository_id" ]] || refuse
          [[ "${WORKFLOW_REF:-}" == "$workflow_prefix"* ]] || refuse

          case "${EVENT_NAME:-}" in
            pull_request)
              [[ "${PR_HEAD_REPOSITORY:-}" == "$expected_repository" ]] || refuse
              [[ "${PR_HEAD_REPOSITORY_ID:-}" == "$expected_repository_id" ]] || refuse
              [[ "${PR_BASE_REPOSITORY:-}" == "$expected_repository" ]] || refuse
              [[ "${PR_BASE_REPOSITORY_ID:-}" == "$expected_repository_id" ]] || refuse
              ;;
            workflow_dispatch)
              ;;
            *)
              refuse
              ;;
          esac

          [[ -n "${GITHUB_OUTPUT:-}" ]] || refuse
          printf 'admitted=true\n' >> "$GITHUB_OUTPUT"

  typescript-parity:
    needs: trust-admission
    if: needs.trust-admission.outputs.admitted == 'true'
    # Reusable under ci.yml, the existing PR/manual admission context.
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ['24.19.0', '26.1.0']
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: '2'
      JOPE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare pinned compilers in task-local storage
        run: |
          NODE_VERSION='${{ matrix.node }}' bash ops/ci/typescript.sh prepare
      - name: Formatting and complete source checks
        run: bash ops/ci/typescript.sh source-check
      - name: Complete census, golden parity, 100 percent facade coverage and publication contracts
        run: bash ops/ci/typescript.sh qualify
      - name: Every census fixture in Chromium, Firefox, WebKit and module workers
        if: matrix.node == '26.1.0'
        env:
          JOPE_TS_BROWSERS: chromium,firefox,webkit
        run: bash ops/ci/typescript.sh browser
      - name: Require complete exact-source qualification evidence
        env:
          JOPE_TS_EXPECTED_NODE: ${{ matrix.node }}
        run: bash ops/ci/typescript.sh evidence target/typescript-evidence
      - name: Retain qualification logs and source-bound receipt
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: typescript-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.node }}
          path: target/typescript-evidence/
