name: typescript
on:
  workflow_call:
permissions:
  contents: read
jobs:
  typescript-parity:
    # Reusable under ci.yml, the existing PR/manual admission context.
    runs-on: [self-hosted, linux, x64, jope-ci]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ['24.19.0', '26.1.0']
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: '2'
      JOPE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Persistent Cargo target
        uses: ./.github/actions/cargo-target
      - name: Runner provenance
        uses: ./.github/actions/runner-provenance
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare pinned compilers in task-local storage
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${{ matrix.node }}"
          bash deploy/ci/typescript/compiler-tools.sh
          npm ci --prefix deploy/ci/typescript --ignore-scripts --no-audit --no-fund
      - name: Formatting and complete source checks
        run: |
          set -euo pipefail
          git diff --check
          cargo fmt --all --check
          cargo check --locked -p feat-math -p jope-cli -p jope-pipeline --no-default-features --all-targets
      - name: Complete census, golden parity, 100 percent facade coverage and publication contracts
        run: bash deploy/ci/typescript/qualify.sh
      - name: Every census fixture in Chromium, Firefox, WebKit and module workers
        if: matrix.node == '26.1.0'
        env:
          JOPE_TS_BROWSERS: chromium,firefox,webkit
        run: bash deploy/ci/typescript/browser-tools.sh
      - name: Require complete exact-source qualification evidence
        env:
          JOPE_TS_EXPECTED_NODE: ${{ matrix.node }}
        run: node deploy/ci/typescript/evidence.mjs create target/typescript-evidence
      - name: Retain qualification logs and source-bound receipt
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: typescript-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.node }}
          path: target/typescript-evidence/
