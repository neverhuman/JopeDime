name: typescript
on:
  pull_request:
    paths:
      - 'crates/feat-math/**'
      - 'crates/jope-cli/**'
      - 'crates/jope-pipeline/**'
      - 'deploy/ci/typescript/**'
      - '.github/workflows/typescript.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typescript-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  typescript-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: '2'
      JOPE_TYPESCRIPT_PARITY: '1'
      JOPE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.1.0'
      - name: Prepare pinned compilers
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
          npm ci --prefix deploy/ci/typescript --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/deploy/ci/typescript/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Formatting and complete source checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cargo check --locked -p jope-cli --no-default-features
      - name: Recipe and fitted parity in strict CommonJS and ESM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/typescript-evidence target/typescript-tmp
          export TMPDIR="$PWD/target/typescript-tmp"
          test "$(git rev-parse HEAD)" = "$JOPE_SOURCE_SHA"
          rustc --version > target/typescript-evidence/toolchains.txt
          node --version >> target/typescript-evidence/toolchains.txt
          tsc --version >> target/typescript-evidence/toolchains.txt
          cargo test --locked -p feat-math --no-default-features --test golden -- --test-threads=2 --nocapture 2>&1 | tee target/typescript-evidence/recipes.log
          cargo test --locked -p feat-math --no-default-features --lib advanced_v3::emit:: -- --test-threads=2 --nocapture 2>&1 | tee target/typescript-evidence/fitted.log
          cargo test --locked -p feat-math --no-default-features --test artifact_target_binding 2>&1 | tee target/typescript-evidence/bindings.log
          cargo test --locked -p jope-pipeline --test artifact_target_binding 2>&1 | tee target/typescript-evidence/pipeline.log
          cargo test --locked -p jope-cli --no-default-features --lib kernel::artifact_v3_tests:: 2>&1 | tee target/typescript-evidence/cli.log
          printf 'source=%s\nrun=%s\nattempt=%s\n' "$JOPE_SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > target/typescript-evidence/identity.txt
      - name: Require executed parity and nonzero test results
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path("target/typescript-evidence")
          for name in ("recipes", "fitted", "bindings", "pipeline", "cli"):
              text = (root / (name + ".log")).read_text()
              counts = re.findall(r"test result: ok\. (\d+) passed; (\d+) failed", text)
              assert counts and sum(int(p) for p, _ in counts) > 0, name + ": zero tests"
              assert all(int(f) == 0 for _, f in counts), name + ": failed tests"
          for name, minimum in (("recipes", 20), ("fitted", 3)):
              text = (root / (name + ".log")).read_text()
              common = text.count("TypeScript cjs:")
              esm = text.count("TypeScript esm:")
              assert common == esm and common >= minimum, (name, common, esm)
              print(name, common, "CommonJS and", esm, "ESM executions")
          PY
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Retain qualification logs
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: typescript-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/typescript-evidence/
      - name: Verify evidence publication
        if: always()
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: typescript-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/typescript-evidence/
          lookup-only: true
          fail-on-cache-miss: true
