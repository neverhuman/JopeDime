title = "JopeDime gitleaks"
[extend]
useDefault = true
[[rules]]
id = "jope-env-files"
description = "environment files with credentials must never be committed"
path = '''(^|/)[^/]*\.env$'''
[allowlist]
# python/src/jope/research/test_workspace_sync.py was archived at 8a55c4fef (Python removal P1;
# docs/archive/python-archive-manifest.json). Its entry stays: `gitleaks detect` in
# deploy/ci/check.sh scans git history, where the file and its synthetic key fixture remain.
paths = ['''^docs/legacy/''', '''\.sha256$''', '''SHA256SUMS$''', '''^python/src/jope/research/test_workspace_sync\.py$''']  # synthetic 'BEGIN OPENSSH PRIVATE KEY header\nsecret' fixture
# A credential may itself be a 40/64-character hexadecimal value. Never allow
# findings solely because they contain a content hash or Git object ID.
regexes = ['''^EvaluationKey\.v2$''', '''^ObservationKeyV2$''']  # exact documented schema/type fixtures


# These public digest fields were reviewed in the retained full-HEAD findings.
# Each exception requires BOTH an exact provenance file and an exact digest
# assignment match. It cannot allow a different credential on the same line.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Reviewed public provenance digest context 1"
condition = "AND"
regexTarget = "match"
paths = ['''^python/src/jope/policy/tokens\.py$''']
regexes = ['''^ERATION31_TOKEN_SHA256 = "[0-9a-f]{64}"$''']

[[rules.allowlists]]
description = "Reviewed public provenance digest context 2"
condition = "AND"
regexTarget = "match"
paths = ['''^deploy/dl-flywheel/pipelines/continuous_v6/tests/fixtures/kl_pins\.json$''']
regexes = ['''^MAX_TOKENS_PER_CHUNK": "[0-9a-f]{64}"$''']

