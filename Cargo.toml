[workspace]
resolver = "2"
members = [
  "crates/feat-math",
  "crates/hyperion",
  "crates/jope-policy",
  "crates/battle-gpu",
  "crates/jope-arena",
  "crates/jope-bench",
  "crates/jope-engine",
  "crates/jope-campaigns",
  "crates/jope-ci",
  "crates/jope-cli",
  "crates/jope-datasets",
  "crates/jope-encoders",
  "crates/jope-models",
  "crates/jope-learning",
  "crates/jope-motifs",
  "crates/jope-paths",
  "crates/jope-pipeline",
  "crates/jope-records",
  "crates/numpy-pcg64",
  "crates/smartcluster/jain-smartcluster-core",
  "crates/smartcluster/jain-smartcluster",
  "crates/smartcluster/jain-smartcluster-fabric",
  "crates/smartcluster/jain-smartcluster-daemon",
  "crates/smartcluster/jain-worker",
  "crates/smartcluster/jainnode",
  "crates/smartcluster/scq",
]
# What a bare `cargo build` / `cargo test` / `cargo run --bin jope` from this directory selects:
# the `jope` binary and the workspace crates it depends on directly. Two direct dependencies are
# left out on purpose, and are still built as dependencies of `jope`: `hyperion`, whose own
# default features pull in jope-engine and the smartcluster crates (jope-cli takes it with
# `hyperion-cpu` only), and `jope-learning`, whose dev-dependencies pull in jope-engine. Every CI
# lane and justfile recipe names its crates with `--workspace` or `-p`; add `--workspace` for the
# rest.
default-members = [
  "crates/jope-cli",
  "crates/feat-math",
  "crates/jope-bench",
  "crates/jope-datasets",
  "crates/jope-models",
  "crates/jope-motifs",
  "crates/jope-pipeline",
  "crates/jope-policy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/neverhuman/JopeDime"

[workspace.dependencies]
# shared by feat-math / jope-campaigns (former root workspace) and the vendored smartcluster workspace
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
crossterm = "0.29"
ed25519-dalek = "2"
futures-core = "0.3"
futures-util = "0.3"
hex = "0.4"
nix = { version = "0.29", features = ["fs", "process", "signal", "socket", "term", "user"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
proptest = "1"
rand = "0.8"
rayon = "1"
redb = "2"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
zeroize = "1"

# Hashing sits on every authority/witness path (the engine hashes its own ~220 MB debug binary and
# the worker binary at startup). Unoptimised sha2 made the 30 s readiness deadline of the
# fit-authority tests unreachable in dev/test builds (docs/parity/test-run-20260918.md); release
# builds are unaffected.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
