torch_sys_0_26_0 = { package = "torch-sys", path = "vendor/security/torch-sys-0.26.0" }

# Reconcile Dope's pinned Candle source with the reviewed workspace security backports.
[patch."https://github.com/eveselove/planly-candle"]
candle-core = { path = "vendor/security/candle-core-0.11.0" }
candle-nn = { version = "=0.11.0" }
