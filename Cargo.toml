[workspace]
resolver = "2"
# Source-pinned third-party dependency repairs remain outside product workspace ownership.
exclude = ["vendor/security/*"]
members = [
  "crates/jope-telemetry",
  "crates/jope-observatory",
  "crates/feat-math",
  "crates/hyperion",
  "crates/jope-policy",
  "crates/battle-gpu",
  "crates/jope-appliance",
  "crates/jope-arena",
  "crates/jope-assets",
  "crates/jope-automl",
  "crates/jope-bench",
  "crates/jope-engine",
  "crates/jope-campaigns",
  "crates/jope-ci",
  "crates/jope-client",
  "crates/jope-cli",
  "crates/jope-datasets",
  "crates/jope-dist",
  "crates/jope-encoders",
  "crates/jope-models",
  "crates/jope-learning",
  "crates/jope-motifs",
  "crates/jope-narrator",
  "crates/jope-paths",
  "crates/jope-pipeline",
  "crates/jope-records",
  "crates/jope-runtime",
  "crates/jope-service",
  "crates/numpy-pcg64",
  "crates/jope-api",
  "crates/smartcluster/jain-smartcluster-core",
  "crates/smartcluster/jain-smartcluster",
  "crates/smartcluster/jain-smartcluster-fabric",
  "crates/smartcluster/jain-smartcluster-daemon",
  "crates/smartcluster/jain-worker",
  "crates/smartcluster/jainnode",
  "crates/smartcluster/scq",
]
# What a bare `cargo build` / `cargo test` / `cargo run --bin jope` from this directory selects:
# the `jope` binary and the workspace crates it depends on directly. Two direct dependencies are
# left out on purpose, and are still built as dependencies of `jope`: `hyperion`, whose own
# default features pull in jope-engine and the smartcluster crates (jope-cli takes it with
# `hyperion-cpu` only), and `jope-learning`, whose dev-dependencies pull in jope-engine. Every CI
# lane and justfile recipe names its crates with `--workspace` or `-p`; add `--workspace` for the
# rest.
default-members = [
  "crates/jope-cli",
  "crates/feat-math",
  "crates/jope-bench",
  "crates/jope-datasets",
  "crates/jope-models",
  "crates/jope-motifs",
  "crates/jope-narrator",
  "crates/jope-pipeline",
  "crates/jope-policy",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/neverhuman/JopeDime"

[workspace.dependencies]
# shared by feat-math / jope-campaigns (former root workspace) and the vendored smartcluster workspace
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
arrow-array = "60"
arrow-schema = "60"
parquet = { version = "60", default-features = false, features = ["arrow"] }
pyo3 = { version = "0.30.1", features = ["extension-module"] }
jope-telemetry = { path = "crates/jope-telemetry" }
crc32fast = "1"
crossterm = "0.29"
ed25519-dalek = "2"
futures-core = "0.3"
futures-util = "0.3"
hex = "0.4"
nix = { version = "0.29", features = ["fs", "process", "signal", "socket", "term", "user"] }
nvml-wrapper = "0.12.1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
# Appliance package signatures (pure Rust): ECDSA P-256 over SHA-256, cosign-compatible (jope-assets).
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "std"] }
proptest = "1"
rand = "0.8"
rayon = "1"
redb = "2"
rtrb = "0.4.1"
rustls = "0.23.46"
# Pure-Rust zstd decoder: the `jopedime` appliance decodes its packaged assets with it (jope-assets).
ruzstd = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
zeroize = "1"
# zstd encoder for the appliance packer only (jope-dist); never linked into `jopedime`.
zstd = "0.14.3"

# Hashing sits on every authority/witness path (the engine hashes its own ~220 MB debug binary and
# the worker binary at startup). Unoptimised sha2 made the 30 s readiness deadline of the
# fit-authority tests unreachable in dev/test builds (docs/parity/test-run-20260918.md); release
# builds are unaffected.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

# Rust 1.97.1 can emit a zero-length debug CGU for the enlarged emitter crate,
# which its archive builder rejects. Keep this workaround scoped to debug/test
# feat-math builds; generated models and release profiles retain their flags.
[profile.dev.package.feat-math]
codegen-units = 1

[profile.test.package.feat-math]
codegen-units = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The `jopedime` appliance (deploy/appliance/SPECIFICATION.md §12.2). Speed first: fitting and
# prediction dominate run time and the weights, not the code, dominate the file, so numerical
# crates stay at opt-level 3 (no blanket "z": it disables loop vectorization). `panic` stays
# "unwind": fitting contains failing candidates with catch_unwind. Cargo strips the symbols, so the
# executable jope-dist packs is exactly what Cargo emitted.
[profile.dist]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
strip = "symbols"
incremental = false
panic = "unwind"

# Cold glue at size; measured against opt-level 3 in deploy/appliance/size-budgets.toml.
# `strip` is repeated on purpose: with an override that omits it, Cargo passes
# `-C strip=debuginfo` to this crate, which links the executable, and the symbol tables stayed in
# (deploy/appliance/AMENDMENTS.md A13).
[profile.dist.package.jope-appliance]
opt-level = "s"
strip = "symbols"
[profile.dist.package.clap_builder]
opt-level = "s"

# The PR lane's appliance build: same flags, thin LTO and parallel codegen to fit the PR budget.
# Release artifacts always use `dist`.
[profile.dist-ci]
inherits = "dist"
lto = "thin"
codegen-units = 16

# Keep CLI/receipt glue in one codegen unit; numerical crates retain parallel codegen
# and opt-level 3. The production `dist` profile is unchanged.
[profile.dist-ci.package.jope-appliance]
opt-level = "s"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Root integration suggestion only; merge with any existing patch table.
[patch.crates-io]
crossterm = { path = "vendor/security/crossterm-0.28.1" }
candle_core_0_11_0 = { package = "candle-core", path = "vendor/security/candle-core-0.11.0" }
gemm_0_18_2 = { package = "gemm", path = "vendor/security/gemm-0.18.2" }
gemm_0_19_0 = { package = "gemm", path = "vendor/security/gemm-0.19.0" }
gemm_c32_0_18_2 = { package = "gemm-c32", path = "vendor/security/gemm-c32-0.18.2" }
gemm_c32_0_19_0 = { package = "gemm-c32", path = "vendor/security/gemm-c32-0.19.0" }
gemm_c64_0_18_2 = { package = "gemm-c64", path = "vendor/security/gemm-c64-0.18.2" }
gemm_c64_0_19_0 = { package = "gemm-c64", path = "vendor/security/gemm-c64-0.19.0" }
gemm_common_0_18_2 = { package = "gemm-common", path = "vendor/security/gemm-common-0.18.2" }
gemm_common_0_19_0 = { package = "gemm-common", path = "vendor/security/gemm-common-0.19.0" }
gemm_f16_0_18_2 = { package = "gemm-f16", path = "vendor/security/gemm-f16-0.18.2" }
gemm_f16_0_19_0 = { package = "gemm-f16", path = "vendor/security/gemm-f16-0.19.0" }
gemm_f32_0_18_2 = { package = "gemm-f32", path = "vendor/security/gemm-f32-0.18.2" }
gemm_f32_0_19_0 = { package = "gemm-f32", path = "vendor/security/gemm-f32-0.19.0" }
gemm_f64_0_18_2 = { package = "gemm-f64", path = "vendor/security/gemm-f64-0.18.2" }
gemm_f64_0_19_0 = { package = "gemm-f64", path = "vendor/security/gemm-f64-0.19.0" }
pulp_0_22_3 = { package = "pulp", path = "vendor/security/pulp-0.22.3" }
ratatui_0_29_0 = { package = "ratatui", path = "vendor/security/ratatui-0.29.0" }
tch_0_26_0 = { package = "tch", path = "vendor/security/tch-0.26.0" }
