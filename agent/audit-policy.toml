# Only keys consumed by the pinned auditor are permitted. Tool identity and
# receipt requirements live in audit-tool.json and the executable gate.
minimum_score = 85
fail_on = ["critical", "high"]
advisory_on = ["medium", "low", "info"]

[scan]
# Generated caches only. Maintained C++, Python, and deployment snapshots remain
# visible. Do not add source paths or global keyword exemptions to improve scores.
# Only these preserved third-party snapshots and one synthetic scanner test source
# are outside authored product scoring. Gitleaks still scans both paths; the test
# suite proves synthetic credentials remain detections.
extra_excluded_paths = [
  "target", ".venv", ".pytest_cache", ".ruff_cache", ".mypy_cache",
  "research/flywheel_selfplay/custody/files",
  "deploy/ci/test-gitleaks-config.py",
]
extra_excluded_globs = ["**/__pycache__/**", "**/*.pyc"]
