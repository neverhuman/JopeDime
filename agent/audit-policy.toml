# Only keys consumed by the pinned auditor are permitted. Tool identity and
# receipt requirements live in audit-tool.json and the executable gate.
minimum_score = 85
fail_on = ["critical", "high"]
advisory_on = ["medium", "low", "info"]

[scan]
# Generated caches and owner-approved, exact-file false-positive exceptions only.
# Exact-file exceptions have per-path evidence and reasons in
# docs/release/jankurai-p5-r2-exceptions-20261102.md and docs/streaming.md. They
# do not alter Gitleaks, Rust/Python tests, or source content. Do not add
# directories, broad globs, or unreviewed paths; each exact exception must be
# removed when its rationale ends.
# Existing custody and synthetic-scanner exceptions remain narrowly scoped.
extra_excluded_paths = [
  "target", ".venv", ".pytest_cache", ".ruff_cache", ".mypy_cache",
  "research/flywheel_selfplay/custody/files",
  "deploy/ci/test-gitleaks-config.py",
  "crates/battle-gpu/src/driver.rs",
  "crates/battle-gpu/src/lib.rs",
