# Only keys consumed by the pinned auditor are permitted. Tool identity and
# receipt requirements live in audit-tool.json and the executable gate.
minimum_score = 85
fail_on = ["critical", "high"]
advisory_on = ["medium", "low", "info"]

[scan]
# Generated caches, the established custody snapshot, the scanner fixture, and
# owner-approved exact-file false-positive exceptions are the only scoring exclusions.
# P5 R2 exact-path exceptions have per-path evidence in
# docs/release/jankurai-p5-r2-exceptions-20261102.md. P9 path-specific reasons follow
# their entries; pinned research and paper bytes remain unchanged. These rules do not
# alter Gitleaks, Rust/Python tests, or source content. Do not add broad globs or
# unreviewed paths. Gitleaks still scans the synthetic fixture and its regression test.
extra_excluded_paths = [
  "target", ".venv", ".pytest_cache", ".ruff_cache", ".mypy_cache",
  "research/flywheel_selfplay/custody/files",
  "deploy/ci/test-gitleaks-config.py",
