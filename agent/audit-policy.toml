# Paid/shared work is governed by docs/testing.md; this declares its preflight surface
# so the auditor can validate the documented cost controls. No spend is approved here.
[[cost_surface]]
name = "external-paid-and-shared-work"
default_external_spend_usd = 0
paid_maximum = "run-specific owner-approved dollar cap"
quota = "preflight quota and limit confirmed before launch"
stop_condition = "stop at cost, resource, wall-time cap, unknown result, or failed input pin"
kill_switch = "supervising lane halt tested before launch"
