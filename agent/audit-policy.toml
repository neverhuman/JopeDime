# Only keys consumed by the pinned auditor are permitted. Tool identity and
# receipt requirements live in audit-tool.json and the executable gate.
minimum_score = 85
fail_on = ["critical", "high"]
advisory_on = ["medium", "low", "info"]

[scan]
# Generated caches and owner-approved, exact-file false-positive exceptions only.
# Exact-file exceptions have per-path evidence and reasons in the corresponding
# dated release registers. They do not alter Gitleaks, Rust/Python tests, or source
# content. Do not add directories, broad globs, or unreviewed paths; remove each
# exact exception when its rationale ends. Existing custody and synthetic-scanner
# exceptions remain narrowly scoped.
