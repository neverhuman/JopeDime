schema_version = "1.0.0"

[[zone]]
path = "target/"
source = "Cargo, Jankurai, and local CI lanes"
command = "just score or the owning proof lane"
read_only = true
write_policy = "auditor_output"

[[zone]]
path = "target/jankurai/"
source = "jankurai audit"
command = "just score"
read_only = true
write_policy = "auditor_output"

# Frozen third-party environment snapshot. verify_custody.py checks the manifest;
# it does not regenerate these bytes. reviewed_manual is the zone schema value for
# reviewed files that are not generator output (generator_only, auditor_output,
# lockfile, reviewed_manual). Do not edit the snapshot in place.
[[zone]]
path = "research/flywheel_selfplay/custody/files/"
source = "research/flywheel_selfplay/custody/MANIFEST.json and EXTERNAL.json"
command = "python3 research/flywheel_selfplay/custody/verify_custody.py"
read_only = true
write_policy = "reviewed_manual"
