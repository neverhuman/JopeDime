schema_version = "1.0.0"

[[zone]]
path = "target/"
source = "Cargo, Jankurai, and local CI lanes"
command = "just score or the owning proof lane"
read_only = true
write_policy = "auditor_output"

[[zone]]
path = "target/jankurai/"
source = "jankurai audit"
command = "just score"
read_only = true
write_policy = "auditor_output"

[[zone]]
path = "deploy/kernel-v1/source/"
source = "agent/deployment-source-map.json (immutable historical Git source)"
command = "python3 ops/ci/snapshot.py --verify"
read_only = true
write_policy = "auditor_output"

# Historical third-party environment snapshot retained as research custody evidence.
# Never edit or regenerate in place; verify its inventory against the owning manifest.
[[zone]]
path = "research/flywheel_selfplay/custody/files/"
source = "research/flywheel_selfplay/custody/MANIFEST.json and EXTERNAL.json"
command = "python3 research/flywheel_selfplay/custody/verify_custody.py"
read_only = true
write_policy = "immutable_custody"

# Frozen historical submission copied into the paper packet and byte-pinned there.
[[zone]]
path = "docs/paper/innovationzero/artifacts/sources/GPT6_Astra_Max.rs"
source = "docs/paper/innovationzero/evidence/artifact-manifest.json"
command = "bash docs/paper/innovationzero/scripts/check.sh"
read_only = true
write_policy = "immutable_evidence"
