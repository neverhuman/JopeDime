# cliff.toml — git-cliff changelog configuration (release.yml renders the notes for every v* tag).
#
# JopeDime commit subjects are "<area>: what changed" (feat-math:, hygiene:, ci:, campaigns:, …),
# not Conventional Commits, so grouping is by the leading area. Dependabot commits form their own
# group. Run locally: `git cliff --unreleased` (or `just docs` to lint the config).

[changelog]
header = """
# Changelog

All notable changes to JopeDime. Generated by git-cliff from the commit history; the sections are
the commit areas (crate or lane) named in each subject line.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=8, end="") }})\
{% endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
render_always = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
# Commit subjects are area-prefixed; the first matching parser wins.
commit_parsers = [
  { message = "^build\\(deps\\)", group = "<!-- 10 -->Dependencies" },
  { message = "^(feat-math|emitters?):", group = "<!-- 01 -->feat-math and emitters" },
  { message = "^(engine|jope-engine|neural|grammar|vocabulary):", group = "<!-- 02 -->Engine" },
  { message = "^(campaigns|selfplay|arena|learning|hwm|scores):", group = "<!-- 03 -->Campaigns, self-play and learning" },
  { message = "^(crates|hyperion|policy|encoders|numpy-pcg64|models|datasets|paths|contracts|vendor):", group = "<!-- 04 -->Crates, models and datasets" },
  { message = "^(python|py):", group = "<!-- 05 -->Python" },
  { message = "^(ci|hygiene|deploy|release|build|workspace|parity|docs/parity):", group = "<!-- 06 -->CI, build and release" },
  { message = "^(docs?|adr|readme|runbooks?):", group = "<!-- 07 -->Documentation" },
  { message = "^(chore|history|migration):", group = "<!-- 08 -->Chores" },
  { message = ".*", group = "<!-- 09 -->Other changes" },
]
