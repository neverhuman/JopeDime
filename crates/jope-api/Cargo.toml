[package]
name = "jope-api"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared JopeDime v1 wire contract and JSON schemas"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "=1.2.3"
# Parsing and formatting stay available without an entropy source; only fresh
# run-id generation needs ulid/std (rand + getrandom). The standalone WASM
# browser runtime consumes this crate without that feature.
ulid = { version = "1", default-features = false }

[features]
default = ["run-id-generation"]
run-id-generation = ["ulid/std"]

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
