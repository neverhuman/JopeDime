[package]
name = "jope-appliance"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The jopedime appliance: one signed executable that fits and predicts with native methods and its packaged assets"

[[bin]]
name = "jopedime"
path = "src/main.rs"

[dependencies]
starforge = { path = "../jope-encoders", optional = true, features = ["dope"] }
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
jope-api = { path = "../jope-api" }
jope-client = { path = "../jope-client", optional = true }
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"], optional = true }
tokio = { workspace = true, optional = true }
jope-assets = { path = "../jope-assets" }
jope-paths = { path = "../jope-paths" }
jope-runtime = { path = "../jope-runtime" }
jope-service = { path = "../jope-service", optional = true }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
signal-hook = "=0.3.18"
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
jope-client = { path = "../jope-client", features = ["engine", "fake"] }
# Test builds of `jopedime` pack fixture packages and trust the development key. Release builds
# (no dev-dependencies) get neither.
jope-assets = { path = "../jope-assets", features = ["pack", "dev-keys"] }
# The repository's JSON Schema validator, for the run receipt schema.
jope-datasets = { path = "../jope-datasets" }
portable-pty = "0.9"
tempfile.workspace = true

[features]
default = ["engine", "mcp", "client"]
mcp = ["client", "dep:rmcp", "dep:tokio"]
engine = ["dep:jope-service", "jope-client?/engine"]
# Internal research CLI; ordinary and embedded release builds do not select it.
research = ["engine", "jope-service/research"]
# Build service client commands without requiring the embedded engine.
client = ["dep:jope-client"]
dope-encoding = ["dep:starforge"]
dope-cuda = ["dope-encoding", "starforge/dope-cuda"]
# The executable refuses to run without its sealed package: every release build sets it, so a
# release binary separated from its payload stops instead of running unauthenticated.
embedded = []
# Trust the deterministic development key: fixture packages in CI only. Never in a release
# (`--version --json` reports it; the release lane refuses it).
dev-keys = ["jope-assets/dev-keys"]

[lints]
workspace = true
