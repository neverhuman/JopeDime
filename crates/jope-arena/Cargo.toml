[package]
name = "jope-arena"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SOTArena benchmark plumbing: dataset fetch, Elo ladders, family reporting, score emission and publication"

[lib]
name = "jope_arena"
path = "src/lib.rs"

[[bin]]
name = "jope-arena"
path = "src/main.rs"

[features]
default = []
# `s3://` publication targets (object_store's AWS backend); `file://` needs nothing.
s3 = ["object_store/aws"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
csv = "1.4"
flate2 = "1"
object_store = { version = "0.14", default-features = false, features = ["fs"] }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
tokio.workspace = true
ureq = "2.10"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
