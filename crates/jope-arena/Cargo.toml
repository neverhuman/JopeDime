[package]
name = "jope-arena"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SOTArena benchmark plumbing: dataset fetch, Elo ladders, family reporting, score emission and publication"

[lib]
name = "jope_arena"
path = "src/lib.rs"

[[bin]]
name = "jope-arena"
path = "src/main.rs"

[features]
default = []
# `s3://` publication targets (object_store's AWS backend); `file://` needs nothing.
s3 = ["object_store/aws"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
csv = "1.4"
flate2 = "1"
object_store = { version = "0.14", default-features = false, features = ["fs"] }
# Pure-Rust zstd decoder (already in the workspace via starforge) for `.zst` inputs.
ruzstd = "0.9.1"
# The rustls crypto provider is named here (and handed to `ureq` in `fetch.rs`) so the
# workspace resolves exactly one: `ureq` is built with `rustls-no-provider`, which keeps
# `rustls/ring` out of the graph alongside the `rustls/aws_lc_rs` that jainnode and
# object_store/reqwest already enable. Two provider features make
# `CryptoProvider::from_crate_features()` return `None` and every bare
# `rustls::ClientConfig::builder()` in the workspace panics.
rustls.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
tokio.workspace = true
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
