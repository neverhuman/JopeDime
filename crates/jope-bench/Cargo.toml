[package]
name = "jope-bench"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Same-cut benchmark: tier-1 baselines and a searched program scored on identical cuts, screen then deepen"

[lib]
name = "jope_bench"
path = "src/lib.rs"

[[bin]]
name = "jope-bench"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
feat-math = { path = "../feat-math" }
jope-arena = { path = "../jope-arena" }
jope-automl = { path = "../jope-automl" }
jope-datasets = { path = "../jope-datasets" }
jope-pipeline = { path = "../jope-pipeline" }
# The native roster and fit path shared with the `jopedime` appliance.
jope-runtime = { path = "../jope-runtime" }
jope-learning = { path = "../jope-learning", optional = true }
jope-policy = { path = "../jope-policy", optional = true, features = ["context-producer"] }
candle-core = { version = "0.11.0", default-features = false, optional = true }
rayon.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["time"] }

[dev-dependencies]

[features]
default = []
asm = ["jope-pipeline/qualified-context", "dep:jope-policy", "dep:jope-learning"]

inference-cuda = ["jope-pipeline/timing-study", "asm", "jope-policy/inference-cuda", "dep:candle-core", "candle-core/cuda"]

[lints]
workspace = true
