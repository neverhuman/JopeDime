[package]
name = "jope-bench"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Same-cut benchmark: tier-1 baselines and a searched program scored on identical cuts, screen then deepen"

[lib]
name = "jope_bench"
path = "src/lib.rs"

[[bin]]
name = "jope-bench"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
feat-math = { path = "../feat-math" }
jope-arena = { path = "../jope-arena" }
jope-datasets = { path = "../jope-datasets" }
jope-pipeline = { path = "../jope-pipeline" }
jope-policy = { path = "../jope-policy", optional = true, features = ["context-producer"] }
rayon.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["time"] }

[dev-dependencies]

[features]
default = []
asm = ["jope-pipeline/qualified-context", "dep:jope-policy"]

[lints]
workspace = true
