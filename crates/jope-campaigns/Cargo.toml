[package]
name = "jope-dime-regressor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Frozen 42-dataset jope-dime evolutionary regression campaign"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "=0.29.0"
feat-math = { path = "../feat-math" }
hex = "0.4"
libc = "0.2"
memmap2 = "0.9"
ratatui = "=0.30.2"
rayon = "1"
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate"] }
# GPU screening backend (raw CUDA driver FFI). Optional: the default build is
# dependency-identical; only `--features gpu` links it. The frozen exact-cv
# lane keeps rejecting GPU flags regardless.
battle-gpu = { path = "../battle-gpu", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
gpu = ["dep:battle-gpu"]
gpr-scratch-reuse = ["feat-math/gpr-scratch-reuse"]

