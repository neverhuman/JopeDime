# Target project policy for the checkpoint-fresh self-play rollout. The fresh
# lane outranks legacy drain work without changing protected training/GPU lanes.
default_max_tier = "normal"
allow_live_priority_overrides = false

# Coverage and post-coverage test-adaptive families are owned by the unified
# Priority-10 guard.  Listing the current names here prevents the self-play
# policy loader from normalizing them back to the default weight of 1.
[projects.quant-multiclass]
max_tier = "normal"
weight = 10.0

[projects.quant-timeseries-model]
max_tier = "normal"
weight = 10.0

[projects.jope-multiclass-test-adaptive]
max_tier = "normal"
weight = 10.0
max_gpus = 0

[projects.jope-timeseries-test-adaptive]
max_tier = "normal"
weight = 10.0

[projects.xhyp3]
max_tier = "normal"
weight = 1.0

[projects.jope]
max_tier = "normal"
weight = 1.0
max_gpus = 2

[projects.sotarena-b42]
max_tier = "normal"
weight = 10.0

[projects.jope-testonly]
max_tier = "normal"
weight = 1.0
max_gpus = 1

[projects.jope-selfplay-eval]
max_tier = "normal"
weight = 10.0
max_gpus = 0

[projects.jope-selfplay-fresh]
max_tier = "normal"
weight = 20.0
max_gpus = 0

[projects.jope-selfplay-train]
max_tier = "normal"
weight = 10.0
max_gpus = 3

# Isolated, preemptible 256-dataset encoding chunks. Jobs in this project
# request one GPU plus four companion CPU cores on xbabe3. The job spec marks
# them preemptible; training and proposal projects remain non-preemptible.
[projects.jope-selfplay-breadth-encode]
max_tier = "normal"
weight = 5.0
max_gpus = 1

# Encoder V2 is shadow-only, preemptible bulk work. The capacity controller
# advances from one cluster-wide worker to at most one worker per eligible
# five-node host; job specs still reserve one GPU, four CPUs, and 16 GiB each.
[projects.jope-encoder-v2]
max_tier = "normal"
weight = 1.0
max_gpus = 5

# Temporary isolated best-five DL+GP regression campaign. The project owns
# fresh identities and never consumes the partial jope-strategy-screen state.
[projects.jope-dlgp-best5]
max_tier = "normal"
weight = 10.0
max_gpus = 1
