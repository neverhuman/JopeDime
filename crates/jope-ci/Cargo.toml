[package]
name = "jope-ci"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CI and host-maintenance tooling: Rust ports of the deploy/ci and deploy/maintenance Python helpers (Cargo artifact selection, build-directory report)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "jope-ci"
path = "src/main.rs"

[dependencies]
clap.workspace = true
# Python-compatible JSON (ordered objects, float repr) for the build-report documents.
jope-records = { path = "../jope-records" }
nix.workspace = true
serde_json.workspace = true
sha2.workspace = true
# SIGTERM/SIGINT become a failed receipt (safe flag registration; already in the lock).
signal-hook = "0.3"
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
