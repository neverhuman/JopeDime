[package]
name = "jope-cli"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "JopeDime umbrella command line: `jope engine | selfplay | campaign`"

[[bin]]
name = "jope"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { workspace = true }
jope-campaigns = { path = "../jope-campaigns" }
jope-parallel = { path = "../jope-engine" }
jope-selfplay = { path = "../jope-selfplay" }
