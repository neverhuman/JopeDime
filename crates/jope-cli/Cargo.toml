[package]
name = "jope-cli"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "JOPE-Dime command-line interface"

[[bin]]
name = "jope"
path = "src/main.rs"

[dependencies]
jope-runtime = { path = "../jope-runtime" }
starforge = { path = "../jope-encoders", optional = true, features = ["dope"] }
anyhow.workspace = true
clap.workspace = true
feat-math = { path = "../feat-math" }
hyperion = { path = "../hyperion", default-features = false, features = ["hyperion-cpu"] }
jope-datasets = { path = "../jope-datasets" }
jope-bench = { path = "../jope-bench" }
jope-models = { path = "../jope-models" }
jope-motifs = { path = "../jope-motifs" }
jope-pipeline = { path = "../jope-pipeline" }
jope-learning = { path = "../jope-learning" }
jope-policy = { path = "../jope-policy", default-features = false, features = ["context-producer"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["qualified-training-context"]
dope-encoding = ["dep:starforge", "jope-pipeline/dope-encoding"]
dope-cuda = ["dope-encoding", "starforge/dope-cuda", "jope-pipeline/dope-cuda"]
qualified-training-context = ["jope-pipeline/qualified-context", "dep:jope-policy"]
asm = ["jope-bench/asm"]

inference-cuda = ["jope-bench/inference-cuda"]

[lints]
workspace = true

[[example]]
name = "landmark_one_shot"
path = "examples/landmark_one_shot.rs"
required-features = ["dope-encoding"]
