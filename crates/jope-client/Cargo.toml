[package]
name = "jope-client"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "JopeDime v1 API client"

[features]
engine = ["dep:axum", "dep:http-body-util", "dep:jope-service", "dep:tokio", "dep:tower"]
fake = []

[dependencies]
axum = { version = "=0.8.9", default-features = false, optional = true }
http-body-util = { version = "=0.1.5", optional = true }
jope-api = { path = "../jope-api" }
jope-service = { path = "../jope-service", optional = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
tower = { version = "=0.5.3", default-features = false, features = ["util"], optional = true }
ureq = { version = "=3.5.0", default-features = false }
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }

[[test]]
name = "fake_replay"
path = "tests/fake_replay.rs"
required-features = ["fake"]

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
