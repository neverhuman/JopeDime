[package]
name = "starforge"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure Rust Starforge tabular classifier inference"

[[bin]]
name = "starforge"
path = "src/main.rs"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "dope-core?/cuda"]
dope = ["dep:dope-core"]
dope-cuda = ["dope", "cuda"]

[dependencies]
jope-runtime = { path = "../jope-runtime" }
anyhow.workspace = true
rayon.workspace = true
clap.workspace = true
serde.workspace = true
# Bundle content hashes must not depend on another workspace crate enabling this.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
blake2 = "0.10"
candle-core = "0.11.0"
candle-nn = "0.11.0"
csv = "1.4"
ordered-float = "5.0"
rustix = { version = "1.1.4", features = ["fs"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
# Pure-Rust zstd decoder (no FFI / no C lib / no new runtime .so) used to
# transparently decompress `*.safetensors.zst` weights in-memory at load time.
ruzstd = "0.9.1"

dope-core = { git = "https://github.com/neverhuman/dope", rev = "25d1785c823e0a401b8775306666924e407ccd9f", optional = true }

[dev-dependencies]
proptest.workspace = true

[[test]]
name = "dope_encoding"
path = "tests/dope_encoding.rs"
required-features = ["dope"]
