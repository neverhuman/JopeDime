[package]
name = "starforge"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure Rust Starforge tabular classifier inference"

[[bin]]
name = "starforge"
path = "src/main.rs"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
blake2 = "0.10"
candle-core = "0.11.0"
candle-nn = "0.11.0"
csv = "1.4"
ordered-float = "5.0"
rustix = { version = "1.1.4", features = ["fs"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Pure-Rust zstd decoder (no FFI / no C lib / no new runtime .so) used to
# transparently decompress `*.safetensors.zst` weights in-memory at load time.
ruzstd = "0.8"

[dev-dependencies]
proptest.workspace = true
