[package]
name = "jope-parallel"
publish = false
version = "0.4.1"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"


[dependencies]
nix = { version = "0.29", features = ["signal", "process", "time", "user"] }
tempfile = "3"
jain-smartcluster = { path = "../smartcluster/jain-smartcluster" }
postcard = { version = "1", default-features = false, features = ["use-std"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
hex = "0.4"
ed25519-dalek = "=2.2.0"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
walkdir = "2"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "=0.29.0"
crossterm = "=0.28.1"
libc = "0.2"
# W7 bounded-run transport: TLS 1.3 with pinned host certificates. The workspace's existing
# rustls (aws-lc-rs provider, named explicitly at every config); no new crate.
rustls = { workspace = true }
feat-math = { path = "../feat-math" }
jope-paths = { path = "../jope-paths" }
tch = { version = "=0.26.0", optional = true }

[features]
default = []
neural = ["dep:tch"]
gpr-scratch-reuse = ["feat-math/gpr-scratch-reuse"]

[build-dependencies]
cc = "1"

# Test-only: the W7 fixture executable, the production `jope-native-loop` command line observing
# a checked-in fixture host (tests/support/native_loop_fixture.rs). It is an example target, not
# a binary of the package: Cargo's default test target selection (`cargo test` and `cargo
# nextest` without a target filter, as deploy/ci/full-lane.sh runs them) compiles it, and the
# DEFAULT `cargo build` and `cargo install` do not produce it. An explicit `cargo build
# --example`, `--examples` or `--all-targets`, or `cargo install --example`, can. The separation
# from production rests on the production entrypoints hardwiring `HostSources::system()` and on
# the product target set (the `jope-native-loop` binary), not on Cargo being unable to build it.
[[example]]
name = "jope-native-loop-fixture"
path = "tests/support/native_loop_fixture.rs"

[dev-dependencies]
nix = { version = "0.29", features = ["socket", "uio"] }

[[example]]
name = "research_loop_fixture"
required-features = ["neural"]
