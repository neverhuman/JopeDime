[package]
name = "jope-parallel"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"

[workspace]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
hex = "0.4"
ed25519-dalek = "=2.2.0"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
walkdir = "2"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "=0.29.0"
crossterm = "=0.28.1"
libc = "0.2"
feat-math = { path = "assets/source/jope-dime/vendor/feat-math" }
tch = { version = "=0.20.0", optional = true }

[features]
default = []
neural = ["dep:tch"]
gpr-scratch-reuse = ["feat-math/gpr-scratch-reuse"]

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
debug = 0
