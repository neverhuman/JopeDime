[package]
name = "jope-observatory"
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "Apache-2.0"

[dependencies]
anyhow = "1"
axum = "=0.8.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
