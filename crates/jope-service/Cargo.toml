[package]
name = "jope-service"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "JopeDime v1 engine service"

[features]
failpoints = []
# Internal research tooling; excluded from the default production graph.
research = []

[dependencies]
# Registry declaration patched to the vendored copy by [patch.crates-io], exactly like starforge.
candle_core_0_11_0 = { package = "candle-core", version = "0.11.0" }
p256.workspace = true
safetensors = "=0.8.0"
chrono = "=0.4.45"
futures-util.workspace = true
anyhow.workspace = true
jope-runtime = { path = "../jope-runtime" }
feat-math = { path = "../feat-math" }
rand_chacha = "=0.3.1"
tempfile.workspace = true
memmap2 = "=0.9.11"
nvml-wrapper.workspace = true
jope-api = { path = "../jope-api" }
jope-paths = { path = "../jope-paths" }
jope-telemetry = { path = "../jope-telemetry", default-features = false }
redb = { workspace = true }
ruzstd.workspace = true
sha2 = { workspace = true }
serde = { workspace = true }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
subtle = "=2.6.1"
tokio = { workspace = true }
toml = { workspace = true }
serde_json.workspace = true
ulid = { workspace = true }
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest.workspace = true
tempfile = { workspace = true }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Security", "Win32_System_JobObjects"] }

[[test]]
name = "golden-fixture-loader"
path = "tests/support/golden.rs"

[lints]
workspace = true
