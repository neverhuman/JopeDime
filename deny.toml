[graph]
all-features = false

[advisories]
version = 2
# Each ignore names its advisory, why this workspace is not exposed, and when it ends. Recorded 2026-11-09 when both
# advisories turned the hygiene security lane red for every pull request; a lockfile bump would move the
# Cargo.lock-bound evaluator identity (crates/feat-math/tests/compat_freeze.rs) and needs its own reviewed rebaseline.
ignore = [
  # libsqlite3-sys 0.30.1 bundles SQLite < 3.54.0 (rusqlite "bundled" in jope-engine / jope-learning). The flaw needs a
  # database opened together with a -wal file whose page size differs, written by a less trusted party. These crates
  # open only campaign / learning stores that this process family creates. Remove once a libsqlite3-sys bundling SQLite >= 3.54.0 is adopted.
  { id = "RUSTSEC-2026-0459", reason = "bundled SQLite only opens self-written stores; no untrusted -wal; remove once libsqlite3-sys bundles SQLite >= 3.54.0" },
  # rmcp 3.8.0 (jope-appliance `mcp`, pinned =3.8.0 with only "server" and "transport-io"). The advisory is unbounded
  # response buffering in the Streamable HTTP *client* transports (transport-streamable-http-client-*), which no crate
  # here enables. Remove with the rmcp >= 3.9.0 bump.
  { id = "RUSTSEC-2026-0462", reason = "only rmcp server + transport-io are enabled; the affected HTTP client transports are not compiled; remove with rmcp >= 3.9.0" },
]

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "BSL-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace carry no version; that is not a wildcard registry dependency.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
# The shared Dope contract/encoder is consumed only through a published immutable revision.
allow-git = ["https://github.com/neverhuman/dope"]

# object_store 0.14 → reqwest (rustls) → rustls-platform-verifier → webpki-root-certs, a wasm32-only
# target dependency (never compiled here) whose root-store data is CDLA-Permissive-2.0. Scoped to
# that one crate so the global allow list stays as it is (review finding on #27).
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# jope-arena fetches SOTArena results over HTTPS with ureq, whose rustls backend ships Mozilla's CA
# root store via webpki-roots (1.0, ureq 3's `rustls-webpki-roots`). That data is CDLA-Permissive-2.0
# (a permissive data licence, not code). Scoped to the two root-store crates; the global allow list
# is unchanged.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# ZIP9 replaces the vulnerable ZIP0/2/8 readers and uses this Rust bzip2 decoder.
# Reviewed exact crate license against SPDX bzip2-1.0.6; retain upstream notices.
# This exception is limited to the resolved crate/version, not the global policy.
[[licenses.exceptions]]
name = "libbz2-rs-sys"
version = "=0.2.5"
allow = ["bzip2-1.0.6"]

# jope-telemetry's optional `python` feature (#445) uses pyo3, whose build script depends on
# pyo3-build-config -> target-lexicon. target-lexicon is Apache-2.0 WITH LLVM-exception (OSI
# approved; the exception only widens Apache-2.0). The default build does not enable `python`;
# cargo-deny sees it through --all-features. Scoped to this crate and version; the global allow
# list is unchanged.
[[licenses.exceptions]]
name = "target-lexicon"
version = "=0.13.5"
allow = ["Apache-2.0 WITH LLVM-exception"]

# feat-math vendors the frozen S1 Linux reference math (src/portable_math/frozen_s1/linux_reference,
# SPDX LGPL-2.1-or-later, glibc upstream) so Darwin reproduces Linux S1 bit-for-bit (2660e6330), and
# its manifest declares "Apache-2.0 AND LGPL-2.1-or-later". First-party, publish = false. Scoped to
# this one crate; the global allow list is unchanged.
[[licenses.exceptions]]
name = "feat-math"
allow = ["LGPL-2.1-or-later"]
