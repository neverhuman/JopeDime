[[package_exceptions]]
name = "ureq"
version = "3.5.0"
feature_sets = [
  ["engine", "mcp", "client"], ["embedded", "engine", "mcp", "client"],
  ["engine", "mcp", "client", "cloud-tls"], ["embedded", "engine", "mcp", "client", "cloud-tls"],
]
allowed_features = []
reason = "Featureless local HTTP client; defaults, TLS and remote-fetch dependencies stay disabled and denied."

# A22: `cloud-tls` HTTPS client for the public jAIn CLI's account login (app.veox.ai). Scoped to
# the two cloud-tls selections; every other selection keeps featureless ureq and no TLS stack.
[[package_exceptions]]
name = "ureq"
version = "3.5.0"
feature_sets = [["engine", "mcp", "client", "cloud-tls"], ["embedded", "engine", "mcp", "client", "cloud-tls"]]
allowed_features = ["_rustls", "_tls", "rustls-no-provider", "rustls-webpki-roots"]
reason = "A22: HTTPS to the veox Cloud Workspace with rustls and bundled webpki roots; no proxy, no redirects, no platform verifier."

[[package_exceptions]]
name = "rustls"
version = "0.23.46"
feature_sets = [["engine", "mcp", "client", "cloud-tls"], ["embedded", "engine", "mcp", "client", "cloud-tls"]]
allowed_features = ["aws-lc-rs", "aws_lc_rs", "default", "log", "logging", "prefer-post-quantum", "std", "tls12"]
reason = "A22: TLS for cloud-tls account login only; the engine and local HTTP stay plaintext loopback."

[[package_exceptions]]
name = "aws-lc-rs"
version = "1.18.1"
feature_sets = [["engine", "mcp", "client", "cloud-tls"], ["embedded", "engine", "mcp", "client", "cloud-tls"]]
allowed_features = ["aws-lc-sys", "prebuilt-nasm"]
reason = "A22: the rustls crypto provider selected in cloud.rs; no FIPS or bindgen features."

[[package_exceptions]]
name = "aws-lc-sys"
version = "0.45.0"
feature_sets = [["engine", "mcp", "client", "cloud-tls"], ["embedded", "engine", "mcp", "client", "cloud-tls"]]
allowed_features = ["prebuilt-nasm"]
reason = "A22: statically linked AWS-LC for aws-lc-rs; links no shared library (checked by NEEDED in build.sh and release.sh)."
