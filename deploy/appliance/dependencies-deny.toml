  ["engine", "mcp", "client"], ["embedded", "engine", "mcp", "client"],
  ["engine", "mcp", "client", "cloud-tls"], ["embedded", "engine", "mcp", "client", "cloud-tls"],
]
allowed_features = ["rayon", "std"]
reason = "Pure Rust typed CPU kernels required by pinned gemm0.19; no native/CUDA backend."

[[package_exceptions]]
name = "gemm-f16"
version = "0.19.0"
feature_sets = [
  ["engine", "mcp", "client"], ["embedded", "engine", "mcp", "client"],
  ["engine", "mcp", "client", "cloud-tls"], ["embedded", "engine", "mcp", "client", "cloud-tls"],
]
allowed_features = ["rayon", "std"]
reason = "Pure Rust typed CPU kernels required by pinned gemm0.19; no native/CUDA backend."

[[package_exceptions]]
name = "gemm-f32"
version = "0.19.0"
feature_sets = [
  ["engine", "mcp", "client"], ["embedded", "engine", "mcp", "client"],
  ["engine", "mcp", "client", "cloud-tls"], ["embedded", "engine", "mcp", "client", "cloud-tls"],
]
allowed_features = ["rayon", "std"]
