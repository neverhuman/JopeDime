[[package_exceptions]]
name = "gemm-f64"
version = "0.19.0"
feature_sets = [
  ["engine", "mcp", "client"], ["embedded", "engine", "mcp", "client"],
  ["engine", "mcp", "client", "cloud-tls"], ["embedded", "engine", "mcp", "client", "cloud-tls"],
]
