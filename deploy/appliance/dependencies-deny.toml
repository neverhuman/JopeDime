version = "1.11.1"
feature_sets = [["engine", "mcp", "client"], ["embedded", "engine", "mcp", "client"]]
allowed_features = ["default", "http1", "server"]
reason = "Axum HTTP1 engine server; existing loopback/auth boundary remains required; no HTTP client/TLS allowance."

# A24: retain the featureless HTTP client in minimal editions; HTTPS is client-only.
[[package_exceptions]]
name = "ureq"
version = "3.5.0"
feature_sets = [[], ["embedded"], ["embedded", "dev-keys"]]
allowed_features = []
reason = "Featureless HTTP types and loopback client only; HTTPS refuses without the client feature."

[[package_exceptions]]
name = "ureq"
version = "3.5.0"
feature_sets = [["engine", "mcp", "client"], ["embedded", "engine", "mcp", "client"]]
allowed_features = ["_rustls", "_tls", "rustls-no-provider", "rustls-webpki-roots"]
reason = "A24: explicitly connected CLI needs HTTPS with the existing single AWS-LC provider. Only these exact client selections/version/features; model inference and minimal editions gain no TLS."

