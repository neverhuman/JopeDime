allowed_features = ["default", "http1", "server"]
reason = "Axum HTTP1 engine server; existing loopback/auth boundary remains required; no HTTP client/TLS allowance."

[[package_exceptions]]
name = "ureq"
version = "3.5.0"
feature_sets = [["engine", "mcp", "client"], ["embedded", "engine", "mcp", "client"]]
allowed_features = []
reason = "Featureless local HTTP client; defaults, TLS and remote-fetch dependencies stay disabled and denied."

# --- A22: HTTPS for the released connected client (cloud-tls) ----------------------------------
# Scoped to exactly the two cloud-tls selections, exact versions, features capped to what the
# locked graph resolves. Every other selection keeps ureq featureless and rustls/aws-* denied
# (crates/jope-dist/tests/dependency_fence.rs asserts both directions).

[[package_exceptions]]
name = "ureq"
version = "3.5.0"
feature_sets = [["engine", "mcp", "client", "cloud-tls"], ["embedded", "engine", "mcp", "client", "cloud-tls"]]
allowed_features = ["_rustls", "_tls", "rustls-no-provider", "rustls-webpki-roots"]
reason = "A22: HTTPS to cloud workspaces with rustls and the bundled webpki root store; no native-tls, no platform verifier, no defaults."

[[package_exceptions]]
name = "rustls"
version = "0.23.46"
feature_sets = [["engine", "mcp", "client", "cloud-tls"], ["embedded", "engine", "mcp", "client", "cloud-tls"]]
allowed_features = ["aws-lc-rs", "aws_lc_rs", "default", "log", "logging", "prefer-post-quantum", "std", "tls12"]
reason = "A22: TLS for the connected client; the AWS-LC provider is installed explicitly in cloud/client_auth.rs."

[[package_exceptions]]
name = "aws-lc-rs"
version = "1.18.1"
feature_sets = [["engine", "mcp", "client", "cloud-tls"], ["embedded", "engine", "mcp", "client", "cloud-tls"]]
allowed_features = ["aws-lc-sys", "prebuilt-nasm"]
reason = "A22: rustls crypto provider (rustls default); non-FIPS; prebuilt-nasm only affects Windows builds."

[[package_exceptions]]
name = "aws-lc-sys"
version = "0.45.0"
feature_sets = [["engine", "mcp", "client", "cloud-tls"], ["embedded", "engine", "mcp", "client", "cloud-tls"]]
allowed_features = ["prebuilt-nasm"]
reason = "A22: AWS-LC compiled from the pinned crate source and linked statically; also listed in native_allowed."
