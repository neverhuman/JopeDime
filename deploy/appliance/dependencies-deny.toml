# The appliance dependency fence (SPECIFICATION.md §14.1), checked by `jope-dist audit` and
# crates/jope-dist/tests/dependency_fence.rs for every listed feature set of the shipped package.
schema = "jope.appliance-dependency-policy/v1"
package = "jope-appliance"
target = "x86_64-unknown-linux-gnu"
feature_sets = [
  [], ["embedded"], ["embedded", "dev-keys"],
  ["engine", "mcp", "client"], ["embedded", "engine", "mcp", "client"],
]

# Denied in the normal/build closure unless an exact scoped package exception below applies.
deny = [
  # Python, LibTorch and external ML runtimes.
  # Additional CPU appliance bans from spec §3.4.
  "rusqlite", "libsqlite3-sys", "esaxx-rs", "syntect",
  "tch", "torch-sys", "pyo3*", "ort", "ort-sys", "onnxruntime*",
  # Research, training, benchmark, cluster and cloud crates.
  "jope-parallel", "jope-learning", "jope-campaigns", "jope-bench", "jope-pipeline",
  "jope-datasets", "jope-models", "jope-arena", "jope-engine", "jope-ci", "jope-dist",
  "jain-*", "scq", "hyperion", "starforge", "jope-encoders",
  # Remote-fetch/TLS stacks stay out; full v1 loopback HTTP exceptions are scoped below.
  "object_store", "reqwest", "hyper", "ureq", "rustls", "aws-*", "openssl*", "native-tls", "cc", "cmake", "pkg-config",
  # The zstd C library is the packer's encoder only; the appliance decodes with ruzstd.
  "zstd", "zstd-safe", "zstd-sys",
  # Minimal builds exclude tensor runtimes. Full v1 CPU exceptions pin the reviewed versions
  # and CPU features below; CUDA/native backends remain separately fenced (AMENDMENTS.md A3).
  "candle-*", "cudarc", "gemm*", "ug*", "tokenizers", "onig*",
]

# Crates that compile or link non-Rust code. Each must be an approved exception to appear.
native = [
  "cc", "cmake", "bindgen", "pkg-config", "zstd-sys", "libsqlite3-sys", "onig_sys", "openssl-sys",
  "ring", "aws-lc-sys", "libz-sys", "bzip2-sys", "lzma-sys", "cudarc", "nccl*",
]

# Features that must stay off even though their crate is allowed: feature unification could
# otherwise switch them on without adding a package (AMENDMENTS.md A1).
denied_features = ["feat-math/fitted-cpp", "jope-assets/pack"]

[native_allowed]
aws-lc-sys = "Existing workspace AWS-LC provider for authenticated CLI HTTPS only; exact version/features/root selections fenced below."
cc = "Build-only AWS-LC compiler wrapper; exact version/features/root selections fenced below."
cmake = "Build-only AWS-LC configuration; exact version/features/root selections fenced below."
pkg-config = "Build-only AWS-LC probe; exact version/features/root selections fenced below."

# T0115 owner-authorized v1 CPU server/client/ranker scope. Every global deny above remains.
# Exact versions + root selections + dependency feature caps; no native approval is granted.
# See DEPENDENCY-FENCE-FULL-DESIGN.md. Empty allowed_features means NO features, never all.

[[package_exceptions]]
name = "candle-core"
version = "0.11.0"
feature_sets = [["engine", "mcp", "client"], ["embedded", "engine", "mcp", "client"]]
allowed_features = ["default"]
reason = "CPU-only accepted ranker tensor implementation; reviewed vendored source; no CUDA/Metal/native backends."

[[package_exceptions]]
name = "gemm"
version = "0.19.0"
feature_sets = [["engine", "mcp", "client"], ["embedded", "engine", "mcp", "client"]]
allowed_features = ["default", "f16", "gemm-f16", "rayon", "std", "wasm-simd128-enable"]
reason = "Pure Rust CPU matrix kernels required by candle-core0.11; no external BLAS/native runtime."

[[package_exceptions]]
name = "gemm-common"
version = "0.19.0"
feature_sets = [["engine", "mcp", "client"], ["embedded", "engine", "mcp", "client"]]
allowed_features = ["f16", "half", "rayon", "std", "sysctl", "wasm-simd128-enable"]
reason = "Shared pure Rust CPU matrix support for the pinned Candle/GEMM selection."

[[package_exceptions]]
name = "gemm-c32"
version = "0.19.0"
feature_sets = [["engine", "mcp", "client"], ["embedded", "engine", "mcp", "client"]]
allowed_features = ["rayon", "std"]
reason = "Pure Rust typed CPU kernels required by pinned gemm0.19; no native/CUDA backend."

