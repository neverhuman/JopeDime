# Measured size budgets (SPECIFICATION.md §12.4), checked by `jope-dist size-report --budget`.
# Baselines measured 2026-10-21 on x86_64-unknown-linux-gnu, Rust 1.97, at the commit that
# introduced them; a change beyond the tolerance needs a reviewed budget update with attribution.
schema = "jope.appliance-size-budgets/v1"
tolerance_percent = 5

# PR lane: `--profile dist-ci` (fat LTO, one codegen unit), `embedded,dev-keys`.
# Retain the original thin-LTO/16-unit measured ceilings; do not rebaseline them.
[profile.fixture]
base_executable_bytes = 5429128
final_executable_bytes = 5545586
note = "dist-ci build plus 0.1 MiB of generated fixture tensors and notices"

# Release: `--profile dist` (fat LTO, one codegen unit, stripped), `embedded`.
[profile.native-only]
base_executable_bytes = 3713088
final_executable_bytes = 3733648
note = "native methods only; the payload is the licence and third-party notices (sealed with an independent P-256 key)"

# Blocked (models.lock.json). The tensors alone are 438,062,296 bytes before lossless packing.
[profile.full]
base_executable_bytes = 3713088
final_executable_bytes = 460000000
note = "provisional: replace with the first measured internal-restricted build"
