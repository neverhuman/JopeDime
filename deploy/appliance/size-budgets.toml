# Measured size budgets (SPECIFICATION.md §12.4), checked by `jope-dist size-report --budget`.
# Baselines measured 2026-10-21 on x86_64-unknown-linux-gnu, Rust 1.97, at the commit that
# introduced them; a change beyond the tolerance needs a reviewed budget update with attribution.
#
# Rebaselined 2026-10-22 for regression objectives (PR #411), Rust 1.97.1, against main at
# 1240120d built the same way on the same host (deploy/appliance/AMENDMENTS.md A13):
#   * Stripping fixed: `strip = "symbols"` had never reached the executable, so every build
#     carried its symbol tables (591 KB of main's 3,738,480-byte `dist` executable, 1.75 MB of
#     its `dist-ci` one). Stripped, main measures 3,147,304 (`dist`) and 3,684,472 (`dist-ci`).
#   * Regression objectives: +898,952 bytes in `dist` (+28.6% over stripped main) and +928,584
#     in `dist-ci`. Machine code is +688 KB: the objective grammar (parse, validate, evaluate)
#     about 300 KB, the JSON-RPC/MCP adapters 80 KB, objective-aware selection and calibration
#     45 KB, shared serde_json and core instantiations the rest; unwind tables +110 KB, read-only
#     data +73 KB, relocations +28 KB. No dependency was added.
# Rebaselined 2026-10-22 for model-object persistence (PR #413), amendment A14:
#   * Same-host dist-ci executable: 4,613,056 -> 5,319,208 B (+706,152, 15.3%).
#   * Complete object/session CLI and MCP, bounded filesystem publication, strict state JSON
#     and the pinned serde_ignored adapter; numerical algorithms and optimization stay unchanged.
#   * Native-only dist executable: 4,542,168 B; independently sealed size-validation package:
#     4,561,056 B. The production signing key was not used; this is not a published appliance.
# Rebaselined 2026-10-23 after integrated PR427, amendment A15:
#   * Same-host paired dist-ci code: 5,319,832 -> 5,843,120 B (+523,288, 9.84%).
#   * A three-entrypoint decoder/export ablation retains every other merged change and
#     measures 5,321,296 B, attributing 521,824 B of the increase to the new feature.
#   * Fixture values below use the larger actual CI measurement: 5,843,568 B code and
#     5,959,302 B package. The 5% tolerance and unmeasured release budgets are unchanged.
# Rebaselined 2026-10-28 for runtime Search commentary (PR #438), amendment A17:
#   * Actual CI fixture: 6,579,256 B code and 6,696,997 B package; verification passes.
#   * Same-host runtime entrypoint ablation: 6,579,064 -> 5,878,648 B (-700,416 B).
#     Restoring all three files reproduces the full executable's SHA-256 exactly.
#   * The diagnostic retains the current dependency graph; its remaining 35,080 B over
#     the historical code baseline is not separately attributed and fits the old 5% gate.
#   * Only this measured fixture baseline changes; tolerance remains 5%.
# Rebaselined 2026-10-29 for feat-math W1-W9 HPC hotpaths (PR #440), amendment A18:
#   * Measured dist-ci fixture: 7,073,600 B code and 7,188,517 B package; verification
#     and network-isolated clean-host checks pass.
#   * Same-host crates/feat-math/src ablation against main 2f85b953f: 7,073,600 -> 6,579,064 B
#     (-494,536 B, matching A17's 6,579,064 B xbabe2 baseline with 0 B unattributed delta).
#     Restoring crates/feat-math/src reproduces the full executable's SHA-256 exactly.
#   * Only this measured fixture baseline changes; tolerance remains 5%.
schema = "jope.appliance-size-budgets/v1"
tolerance_percent = 5

# PR lane: `--profile dist-ci` (thin LTO, 16 codegen units), `embedded,dev-keys`.
[profile.fixture]
base_executable_bytes = 7073600
final_executable_bytes = 7188517
note = "dist-ci runtime Search commentary + feat-math W1-W9 HPC hotpaths plus 0.1 MiB of generated fixture tensors and notices (A18)"

# Release: `--profile dist` (fat LTO, one codegen unit, stripped), `embedded`.
[profile.native-only]
base_executable_bytes = 4542168
final_executable_bytes = 4561056
note = "native methods only; the payload is the licence and third-party notices (sealed with an independent P-256 key)"

# Blocked (models.lock.json). The tensors alone are 438,062,296 bytes before lossless packing.
[profile.full]
base_executable_bytes = 4542168
final_executable_bytes = 460000000
note = "provisional: replace with the first measured internal-restricted build"

