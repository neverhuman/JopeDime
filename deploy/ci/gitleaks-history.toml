title = "JopeDime HEAD-history gitleaks"
# deploy/ci/secret-scan.sh rewrites the extend path to the absolute base
# config before loading this file. The committed path is only a marker.
[extend]
path = ".gitleaks.toml"

# Historical parallel/recovery tree from eight-a100-20260912. It is not an
# ancestor of current main. A full local object store can still reach it from
# refs/rescue/20260921. The 225 generic-api-key hits are vendored constants.
# The 18 jope-env-files hits are the paths listed below. All 18 were confirmed
# absent from HEAD before this allowlist was added. The HEAD tree scan does
# not load this file, so putting any of these paths back fails that scan.
[allowlist]
description = "Removed historical parallel/recovery tree, absent from HEAD"
paths = ['''^parallel/recovery/''']

