[package]
name = "feat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Genetic-programming feature synthesis + importance epochs + EDA/PBIL selection (100% Rust)"

[features]
default = []
ci-smoke = []
catboost = ["dep:catboost"]
xgboost = ["dep:xgboost"]
lightgbm = ["dep:lightgbm"]
starforge-cpu = ["dep:starforge", "dep:candle-core"]
starforge-cuda = ["starforge-cpu", "starforge/cuda", "candle-core/cuda"]
hyperion-cpu = ["dep:candle-core", "dep:candle-nn"]
hyperion-cuda = ["hyperion-cpu", "candle-core/cuda", "candle-nn/cuda"]

[dependencies]
rayon.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
csv = "1.4"
domain = { path = "../domain" }
feat-math = { path = "../feat-math" }
catboost = { path = "../catboost", optional = true }
xgboost = { path = "../xgboost", optional = true }
lightgbm = { path = "../lightgbm", optional = true }
starforge = { path = "../starforge", default-features = false, optional = true }
candle-core = { version = "0.11.0", default-features = false, optional = true }
candle-nn = { version = "0.11.0", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"
