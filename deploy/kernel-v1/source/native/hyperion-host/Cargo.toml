[package]
name = "parallel-hyperion-host"
version = "0.1.0"
edition = "2021"
[workspace]
[lib]
name = "feat_core"
path = "src/lib.rs"
[[bin]]
name = "hyperion-a100"
path = "../../assets/source/hyperion-jain/crates/feat-cli/src/bin/hyperion_vs.rs"
[features]
default = ["hyperion-cuda"]
hyperion-cpu = []
hyperion-cuda = ["hyperion-cpu","candle-core/cuda","candle-nn/cuda"]
[dependencies]
jope-parallel = {path="../.."}
rayon = "1"
anyhow = "1"
serde = {version="1",features=["derive"]}
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
candle-core = {version="=0.11.0",default-features=false}
candle-nn = {version="=0.11.0",default-features=false}

[[bin]]
name = "hyperion-batch-worker"
path = "src/worker.rs"
