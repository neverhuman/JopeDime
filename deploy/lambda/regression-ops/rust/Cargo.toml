[package]
name = "jope-regression-assessment"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "regression-assess"
path = "src/main.rs"

[dependencies]
feat-math = { path = "../../../../crates/feat-math" }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
flate2 = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
