[package]
name = "jope-island-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
flate2 = "1.1"
rand = "0.9"
rand_chacha = "0.9"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
