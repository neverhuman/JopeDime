[package]
name = "jope-test-adaptive-teacher-lambda"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
feat-math = { path = "../../../../../../crates/feat-math" }
lambda_runtime = "0.13"
tokio = { version = "1", features = ["macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
flate2 = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
