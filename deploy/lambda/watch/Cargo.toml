[package]
name = "jope-lambda-watch"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.28.1"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

