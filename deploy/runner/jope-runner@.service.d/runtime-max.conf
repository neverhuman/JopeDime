# RuntimeMaxSec counts from service start, and the service spends most of its life IDLE waiting
# for a job, so the upstream 1800 s budgets idle time and job time out of the same 30 minutes: a
# listener that waits 20 minutes and then picks up a 13-minute rust-test run is SIGTERM'd mid-job.
# This is a structural property of the unit, not a diagnosis of any particular failure -- the
# mid-step kills seen on 2026-09-21 were the runner's work folder resolving onto the /home/runner
# tmpfs, and were still present after this value was raised. Budget both phases: up to ~45 min
# idle plus the 45-minute workflow timeout.
[Service]
RuntimeMaxSec=5400
