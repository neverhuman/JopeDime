# RuntimeMaxSec counts from service start, and the service spends most of its life IDLE waiting
# for a job — so the upstream 1800 s budgets idle time and job time out of the same 30 minutes.
# A listener that waits 20 minutes and then picks up a 13-minute rust-test run gets SIGTERM'd
# mid-job, which surfaces as a job whose steps have no conclusion and a run marked failed for no
# visible reason. Budget both: up to ~45 min idle plus the 45-minute workflow timeout.
[Service]
RuntimeMaxSec=5400
