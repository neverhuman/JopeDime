[workspace]
resolver = "2"
members = [
    "crates/catboost-sys",
    "crates/catboost",
    "crates/xgboost",
    "crates/lightgbm",
    "crates/domain",
    "crates/feat-core",
    "crates/feat-math",
    "crates/battle-gpu",
    "crates/feat-report",
    "crates/feat-tui",
    "crates/feat-cli",
    "crates/feat-web",
    "crates/starforge",
    "deployment/ops/sagemaker-ci",
]

[workspace.package]
version = "7.0.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
rayon = "1.10"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ratatui = "0.30.2"
bindgen = "0.70"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Keep line tables so a panic backtrace in the shipped binary resolves to file:line (the panic hook
# force-captures a backtrace). Line-tables-only adds negligible size and no runtime cost.
debug = "line-tables-only"

# Faster profile for CI/dev inner-loop builds: the shipped SageMaker images keep
# the `release` profile (full LTO, codegen-units=1); CI only runs tests and does
# not ship the binary, so trade a little runtime speed for ~2-3x faster compiles.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
