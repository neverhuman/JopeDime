[remote]
# Durable per-node paths on worker hosts. MUST NOT live under /tmp: all three
# nodes carry systemd-tmpfiles "D /tmp 1777 root root 30d", which destroys
# /tmp at every boot (this vaporized every deployed release at the 2026-07-12
# 23:13 UTC reboot and left scqd's recovered jobs ENOENT-looping). /home and
# /tmp are the same filesystem on all three nodes, so this costs zero space.
# Persistent outputs are still copied back below prime.runs/cache.
scratch_root = "/home/ubuntu/jope-scratch"

[league]
