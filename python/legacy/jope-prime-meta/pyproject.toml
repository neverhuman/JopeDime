[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jope-prime"
version = "0.2.0"
description = "One-shot feat-math genome trainer with Rust validation authority"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "orjson>=3.10",
  "pyarrow>=20.0",
  "psutil>=5.9",
  "rich>=13.7",
  "safetensors>=0.4",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
feature-foundry = [
  "catboost>=1.2.8",
  "lightgbm>=4.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "xgboost>=2.0",
]

[project.scripts]
jope = "jope.cli:main"
jope-prime = "jope.prime_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
