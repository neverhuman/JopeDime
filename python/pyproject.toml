[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "jope"
version = "0.1.0"
description = "JopeDime Python: dataset encoders, the policy transformer trainer, self-play services and research drivers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Derived from an import scan of python/src (WP6, B22), not from the historical jope-prime manifest.
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.4",
  "safetensors>=0.4",
  "pandas>=2.2",
  "scipy>=1.11",
  "joblib>=1.4",
  "pyarrow>=17",
  "orjson>=3.10",
  "psutil>=5.9",
  "rich>=13.7",
]

[project.optional-dependencies]
benchmark = ["scikit-learn==1.9.1", "PyYAML==6.0.3"]
# Synthetic DL custody fixtures use fake clients; no live AWS access.
dl-custody = ["boto3==1.43.121"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.23", "pip-licenses>=5"]
foundry = ["catboost>=1.2.8", "lightgbm>=4.0", "scikit-learn>=1.4", "xgboost>=2.0"]
research = ["matplotlib>=3.9", "autogluon.tabular>=1.1; python_version < '3.13'", "tabpfn>=2.0", "tabicl>=0.1"]
cpu = ["torch>=2.4"]
cu130 = ["torch>=2.4"]

[project.scripts]
jope-py = "jope.cli:main"

[tool.uv]
# torch index per extra: `uv sync --extra cpu` (hosted CI) or `--extra cu130` (xbabe2)
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/jope"]

[tool.maturin]
manifest-path = "../crates/jope-telemetry/Cargo.toml"
python-source = "src"
module-name = "jope._telemetry"
features = ["python"]

[tool.ruff]
line-length = 110
target-version = "py311"
# research/ drivers are import-checked only; legacy/ is reference. The three grammar sources are pinned by
# sha256 in crates/jope-engine/assets/grammar/featmath.json (vocab_sha256 8d55fee4...): any byte change,
# even a lint fix, invalidates the frozen vocabulary the Rust consumers verify, so ruff never touches them.
extend-exclude = [
  "src/jope/research",
  "legacy",
  "src/jope/grammars/featmath.py",
  "src/jope/policy/tokens.py",
  "src/jope/policy/automaton.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: line length is advisory. The others are opinion rules the inherited code violates on purpose
# or in ways a lint sweep cannot fix without a semantic review (WP6 triage, docs/parity/python-tests-triage.md):
# B905 zip(strict=) (117 sites), B023 closures over loop variables in the samplers/trainers, B007/B904/E731/E741
# naming and exception-chaining style, UP031 printf-style formatting (405 sites), UP028/UP042 generator/str-enum rewrites.
ignore = ["E501", "B905", "B023", "B007", "B904", "E731", "E741", "UP031", "UP028", "UP042"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
# The ops tooling (former parallel/tools) is written in the compressed several-statements-per-line
# style with imports after the environment setup; reformatting it is out of WP6's scope (behaviour
# must not change). The chimera trainers that shared this entry were archived in the Python removal
# P1 (ADR-0006, docs/archive/python-archive-manifest.json).
"src/jope/tools/**" = ["E701", "E702", "E402", "UP022"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "xbabe2: needs the xbabe2 host (GPU, local state plane, SCQ); never runs on hosted runners",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
packages = ["jope"]
