{
  "version": 1,
  "local_only": true,
  "allow_log_rotation": true,
  "allow_log_offload": false,
  "allow_report_offload": false,
  "allowed_hosts": ["xbabe1", "xbabe2", "xbabe3"],
  "repo_root": "~/JopeDime",
  "sccache_max_bytes": 64424509440,
  "offload": {
    "bucket": "veox-jopedime-learning-use2",
    "prefix": "offload",
    "retention_days": 14,
    "sha256_verify_before_remove": true
  },
  "watermarks": {
    "soft_percent": 85,
    "aggressive_percent": 90,
    "alert_percent": 95,
    "low_percent": 80
  },
  "deny_prefixes": [
    "~/jope-data",
    "~/jope_plan",
    "~/jope-rescue-20260921",
    "~/admiralty",
    "~/veox",
    "~/jeryu"
  ],
  "paths": [
    {
      "id": "uv-cache",
      "mode": "observe",
      "manual_only": true,
      "path": "~/.cache/uv",
      "max_bytes": 21474836480,
      "soft_ttl_hours": 720,
      "aggressive_ttl_hours": 72
    },
    {
      "id": "pip-cache",
      "kind": "cache",
      "path": "~/.cache/pip",
      "max_bytes": 5368709120,
      "soft_ttl_hours": 720,
      "aggressive_ttl_hours": 72
    },
    {
      "id": "remote-tests",
      "mode": "observe",
      "manual_only": true,
      "path": "~/remote_tests",
      "max_bytes": 64424509440,
      "ttl_hours": 24
    },
    {
      "id": "cargo-targets",
      "kind": "cargo-target",
      "path": "~/JopeDime/.agent/worktrees",
      "ttl_hours": 24,
      "remove_merged_worktrees": true,
      "remove_closed_pr_worktrees": true,
      "remove_stale_targets_on_open_worktrees": true
    },
    {
      "id": "cargo-cache",
      "mode": "observe",
      "manual_only": true,
      "path": "~/.cargo"
    },
    {
      "id": "docker-cache",
      "mode": "observe",
      "path": "/var/lib/docker",
      "manual_only": true,
      "max_bytes": 21474836480,
      "ttl_hours": 168
    },
    {
      "id": "sccache",
      "mode": "observe",
      "manual_only": true,
      "path": "~/.cache/sccache",
      "max_bytes": 64424509440
    },
    {
      "id": "tmp",
      "mode": "observe",
      "path": "/tmp",
      "manual_only": true,
      "max_bytes": 21474836480,
      "ttl_hours": 24
    }
  ]
}
